<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Analysis Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10; --bg2: #0f1218; --bg3: #141820;
    --border: rgba(255,255,255,0.06); --border2: rgba(255,255,255,0.12);
    --text: #e8eaf0; --muted: #5a6070; --muted2: #8892a0;
    --green: #00d084; --green-dim: rgba(0,208,132,0.12);
    --red: #ff4757; --red-dim: rgba(255,71,87,0.12);
    --amber: #ffa502; --amber-dim: rgba(255,165,2,0.12);
    --blue: #3d8ef8; --blue-dim: rgba(61,142,248,0.12);
    --purple: #a78bfa; --purple-dim: rgba(167,139,250,0.12);
    --accent: #00d084;
    --font-mono: 'JetBrains Mono', monospace;
    --font-fa: 'Vazirmatn', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-fa); min-height: 100vh; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); background: var(--bg2); }
  .logo { font-family: var(--font-mono); font-size: 13px; color: var(--accent); letter-spacing: 2px; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .status-text { font-size: 12px; color: var(--muted2); font-family: var(--font-mono); }
  #lastUpdate { font-size: 11px; color: var(--muted); font-family: var(--font-mono); }
  .alert-banner { display: none; padding: 12px 1.5rem; background: var(--green-dim); border-bottom: 1px solid var(--green); color: var(--green); font-family: var(--font-mono); font-size: 13px; font-weight: 500; animation: alertPulse 1.5s infinite; }
  @keyframes alertPulse { 0%,100% { background: var(--green-dim); } 50% { background: rgba(0,208,132,0.25); } }
  .controls { padding: 1rem 1.5rem; background: var(--bg2); border-bottom: 1px solid var(--border); display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .symbol-tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .symbol-tag { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--border2); border-radius: 4px; font-family: var(--font-mono); font-size: 12px; background: var(--bg3); }
  .symbol-tag.active { border-color: var(--accent); color: var(--accent); background: var(--green-dim); }
  .symbol-tag .remove { color: var(--muted); font-size: 14px; line-height: 1; cursor: pointer; }
  .symbol-tag .remove:hover { color: var(--red); }
  .add-symbol { display: flex; gap: 8px; }
  .add-symbol input { background: var(--bg3); border: 1px solid var(--border2); color: var(--text); padding: 5px 10px; border-radius: 4px; font-family: var(--font-mono); font-size: 12px; width: 120px; outline: none; }
  .btn { padding: 5px 14px; border-radius: 4px; border: 1px solid var(--border2); background: var(--bg3); color: var(--text); cursor: pointer; font-family: var(--font-mono); font-size: 12px; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-accent { border-color: var(--accent); color: var(--accent); background: var(--green-dim); }
  .tf-group { display: flex; gap: 4px; margin-right: auto; }
  .tf-btn { padding: 4px 10px; border-radius: 3px; border: 1px solid var(--border); background: transparent; color: var(--muted2); cursor: pointer; font-family: var(--font-mono); font-size: 11px; }
  .tf-btn.active { border-color: var(--blue); color: var(--blue); background: var(--blue-dim); }
  .settings-input { background: var(--bg3); border: 1px solid var(--border2); color: var(--text); padding: 5px 10px; border-radius: 4px; font-family: var(--font-mono); font-size: 12px; width: 70px; outline: none; text-align: center; }
  .settings-label { font-size: 11px; color: var(--muted2); font-family: var(--font-mono); }
  main { padding: 1.5rem; display: flex; flex-direction: column; gap: 1.5rem; }
  .market-context { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  .ctx-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; }
  .ctx-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
  .ctx-value { font-family: var(--font-mono); font-size: 18px; font-weight: 500; }
  .ctx-sub { font-size: 11px; color: var(--muted2); margin-top: 3px; font-family: var(--font-mono); }
  .symbol-section { display: flex; flex-direction: column; gap: 10px; }
  .symbol-header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; flex-wrap: wrap; }
  .symbol-name { font-family: var(--font-mono); font-size: 16px; font-weight: 700; }
  .symbol-price { font-family: var(--font-mono); font-size: 22px; font-weight: 500; }
  .symbol-change { font-family: var(--font-mono); font-size: 13px; padding: 3px 8px; border-radius: 3px; }
  .pos { color: var(--green); background: var(--green-dim); }
  .neg { color: var(--red); background: var(--red-dim); }
  .neu { color: var(--amber); background: var(--amber-dim); }
  .pur { color: var(--purple); background: var(--purple-dim); }
  .blu { color: var(--blue); background: var(--blue-dim); }
  .symbol-meta { font-size: 11px; color: var(--muted); font-family: var(--font-mono); }

  /* SETUP DETECTOR */
  .setup-detector { display: grid; grid-template-columns: 200px 1fr 280px; gap: 10px; }
  @media (max-width: 900px) { .setup-detector { grid-template-columns: 1fr; } }
  .setup-score-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .score-circle { width: 110px; height: 110px; position: relative; }
  .score-circle svg { transform: rotate(-90deg); }
  .score-circle .score-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: var(--font-mono); font-size: 28px; font-weight: 700; }
  .verdict { margin-top: 12px; font-family: var(--font-mono); font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 4px; letter-spacing: 1px; }
  .direction-label { margin-top: 6px; font-size: 11px; color: var(--muted); font-family: var(--font-mono); }
  .setup-checklist { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; }
  .checklist-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
  .checklist-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px; font-family: var(--font-mono); }
  .check-icon { width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
  .check-pass { background: var(--green-dim); color: var(--green); }
  .check-fail { background: var(--red-dim); color: var(--red); }
  .check-warn { background: var(--amber-dim); color: var(--amber); }
  .check-label { color: var(--text); flex: 1; }
  .check-detail { color: var(--muted2); font-size: 11px; }

  /* POSITION SIZER */
  .position-sizer { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 14px 16px; }
  .ps-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
  .ps-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 12px; font-family: var(--font-mono); }
  .ps-label { color: var(--muted2); }
  .ps-val { font-weight: 500; }
  .ps-divider { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
  .ps-disabled { color: var(--muted); font-style: italic; font-size: 12px; padding: 20px; text-align: center; }

  .futures-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; padding: 10px 14px; background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; }
  .fut-item { display: flex; flex-direction: column; gap: 2px; }
  .fut-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .fut-val { font-family: var(--font-mono); font-size: 13px; font-weight: 500; }
  .tf-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 10px; }
  .tf-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .tf-header { padding: 8px 14px; background: var(--bg3); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .tf-label { font-family: var(--font-mono); font-size: 12px; color: var(--blue); font-weight: 700; }
  .tf-trend { font-size: 11px; padding: 2px 8px; border-radius: 3px; font-family: var(--font-mono); }
  .tf-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 7px; }
  .ind-row { display: flex; align-items: center; justify-content: space-between; }
  .ind-name { font-size: 11px; color: var(--muted2); }
  .ind-val { font-family: var(--font-mono); font-size: 12px; font-weight: 500; }
  .section-divider { border: none; border-top: 1px solid var(--border); margin: 4px 0; }
  .diverg-badge { font-size: 10px; padding: 2px 6px; border-radius: 3px; font-family: var(--font-mono); }
  .pattern-badge { font-size: 10px; padding: 2px 6px; border-radius: 3px; font-family: var(--font-mono); }
  .candles-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .candles-title { padding: 8px 14px; background: var(--bg3); border-bottom: 1px solid var(--border); font-size: 11px; color: var(--muted2); text-transform: uppercase; letter-spacing: 1px; font-family: var(--font-mono); }
  .candles-table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 11px; }
  .candles-table th { padding: 6px 10px; color: var(--muted); font-weight: 400; text-align: left; border-bottom: 1px solid var(--border); }
  .candles-table td { padding: 5px 10px; border-bottom: 1px solid var(--border); }
  .candles-table tr:last-child td { border-bottom: none; }
  .candle-bull { color: var(--green); }
  .candle-bear { color: var(--red); }
  .levels-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 14px; }
  .levels-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
  .level-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .level-type { font-size: 11px; width: 130px; color: var(--muted2); }
  .level-bar { flex: 1; height: 2px; background: var(--border); border-radius: 1px; }
  .level-fill { height: 100%; border-radius: 1px; }
  .level-price { font-family: var(--font-mono); font-size: 12px; font-weight: 500; min-width: 85px; text-align: left; }
  .level-dist { font-size: 11px; color: var(--muted); font-family: var(--font-mono); min-width: 55px; text-align: left; }
  .level-dir { font-size: 11px; font-family: var(--font-mono); min-width: 80px; }
  .copy-section { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .copy-header { padding: 10px 14px; background: var(--bg3); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .copy-title { font-size: 12px; color: var(--accent); font-family: var(--font-mono); }
  .copy-btn { padding: 4px 14px; border-radius: 3px; border: 1px solid var(--accent); color: var(--accent); background: var(--green-dim); cursor: pointer; font-family: var(--font-mono); font-size: 11px; }
  .copy-btn.copied { border-color: var(--blue); color: var(--blue); background: var(--blue-dim); }
  .loading { color: var(--muted); font-family: var(--font-mono); font-size: 12px; padding: 40px; text-align: center; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-left: 8px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .divider { border: none; border-top: 1px solid var(--border); margin: 0.5rem 0; }
</style>
</head>
<body>

<header>
  <div class="logo">◈ TRADE INTEL</div>
  <div class="header-right">
    <div class="status-dot"></div>
    <span class="status-text">LIVE</span>
    <span id="lastUpdate">—</span>
    <label style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted2);font-family:var(--font-mono);cursor:pointer;">
      <input type="checkbox" id="soundToggle" checked /> Alert صوتی
    </label>
  </div>
</header>

<div class="alert-banner" id="alertBanner">🚨 Setup قوی پیدا شد!</div>

<div class="controls">
  <div class="symbol-tags" id="symbolTags"></div>
  <div class="add-symbol">
    <input type="text" id="newSymbol" placeholder="SOLUSDT" maxlength="12" />
    <button class="btn btn-accent" onclick="addSymbol()">+ اضافه</button>
  </div>
  <div style="display:flex;align-items:center;gap:6px;">
    <span class="settings-label">سرمایه $</span>
    <input type="number" class="settings-input" id="capital" value="50" min="10" />
    <span class="settings-label">ریسک %</span>
    <input type="number" class="settings-input" id="riskPct" value="2.5" min="0.5" max="10" step="0.5" />
  </div>
  <div class="tf-group">
    <button class="tf-btn active" data-tf="15m" onclick="toggleTF(this)">15m</button>
    <button class="tf-btn active" data-tf="1h" onclick="toggleTF(this)">1h</button>
    <button class="tf-btn active" data-tf="4h" onclick="toggleTF(this)">4h</button>
    <button class="tf-btn" data-tf="1d" onclick="toggleTF(this)">1d</button>
  </div>
  <button class="btn" onclick="refreshAll()">↻ بروزرسانی</button>
</div>

<main id="mainContent">
  <div class="loading">در حال بارگذاری... <span class="spinner"></span></div>
</main>

<script>
const BASE = 'https://api.binance.com/api/v3';
const FUT_BASE = 'https://fapi.binance.com/fapi/v1';
let symbols = ['BTCUSDT', 'ETHUSDT', 'BNBUSDT'];
let activeTFs = ['15m', '1h', '4h'];
let lastAlertScores = {};

// ── MATH ──
function calcEMA(data, period) { const k = 2/(period+1); let ema = data[0]; for (let i=1;i<data.length;i++) ema = data[i]*k + ema*(1-k); return ema; }

function calcRSISeries(closes, period=14) {
  if (closes.length < period+1) return [];
  const rsis = []; let gains = 0, losses = 0;
  for (let i=1; i<=period; i++) { const d = closes[i]-closes[i-1]; if (d>0) gains+=d; else losses-=d; }
  let avgGain = gains/period, avgLoss = losses/period;
  rsis.push(avgLoss === 0 ? 100 : 100 - 100/(1+avgGain/avgLoss));
  for (let i=period+1; i<closes.length; i++) {
    const d = closes[i]-closes[i-1];
    avgGain = (avgGain*(period-1) + Math.max(d,0))/period;
    avgLoss = (avgLoss*(period-1) + Math.max(-d,0))/period;
    rsis.push(avgLoss === 0 ? 100 : 100 - 100/(1+avgGain/avgLoss));
  }
  return rsis;
}

function calcMACD(closes) { if (closes.length<26) return null; return calcEMA(closes.slice(-12),12) - calcEMA(closes.slice(-26),26); }

function calcBB(closes, period=20) {
  if (closes.length<period) return null;
  const slice = closes.slice(-period);
  const avg = slice.reduce((a,b)=>a+b,0)/period;
  const std = Math.sqrt(slice.reduce((a,b)=>a+(b-avg)**2,0)/period);
  return { upper: avg+2*std, lower: avg-2*std, mid: avg, bandwidth: (4*std)/avg };
}

function calcATR(candles, period=14) {
  if (candles.length<period+1) return null;
  const trs = [];
  for (let i=1; i<candles.length; i++) {
    const h=parseFloat(candles[i][2]), l=parseFloat(candles[i][3]), pc=parseFloat(candles[i-1][4]);
    trs.push(Math.max(h-l, Math.abs(h-pc), Math.abs(l-pc)));
  }
  let atr = trs.slice(0,period).reduce((a,b)=>a+b,0)/period;
  for (let i=period; i<trs.length; i++) atr = (atr*(period-1)+trs[i])/period;
  return atr;
}

function calcVWAP(candles, periods=20) {
  const slice = candles.slice(-periods);
  let cvp=0, cv=0;
  for (const c of slice) {
    const typ = (parseFloat(c[2])+parseFloat(c[3])+parseFloat(c[4]))/3;
    const v = parseFloat(c[5]);
    cvp += typ*v; cv += v;
  }
  return cv>0 ? cvp/cv : null;
}

function countTouches(candles, level, tol=0.003) {
  let t = 0;
  for (const c of candles) {
    const h=parseFloat(c[2]), l=parseFloat(c[3]);
    if (l <= level*(1+tol) && h >= level*(1-tol)) t++;
  }
  return t;
}

function calcCorrelation(a, b) {
  const n = Math.min(a.length, b.length);
  if (n<2) return null;
  const A=a.slice(-n), B=b.slice(-n);
  const mA=A.reduce((x,y)=>x+y,0)/n, mB=B.reduce((x,y)=>x+y,0)/n;
  let num=0, dA=0, dB=0;
  for (let i=0;i<n;i++) { const da=A[i]-mA, db=B[i]-mB; num+=da*db; dA+=da*da; dB+=db*db; }
  const d = Math.sqrt(dA*dB);
  return d===0 ? 0 : num/d;
}

function detectDivergence(closes, highs, lows, rsiSeries) {
  if (closes.length<30 || rsiSeries.length<20) return { type:'NONE', detail:null };
  const n = closes.length;
  const rOff = closes.length - rsiSeries.length;
  const sH = [], sL = [];
  for (let i=n-3; i>Math.max(2, n-30); i--) {
    if (highs[i]>highs[i-1] && highs[i]>highs[i-2] && highs[i]>highs[i+1] && highs[i]>highs[i+2]) {
      sH.push({ idx:i, price:highs[i], rsi:rsiSeries[i-rOff] });
      if (sH.length>=2) break;
    }
  }
  for (let i=n-3; i>Math.max(2, n-30); i--) {
    if (lows[i]<lows[i-1] && lows[i]<lows[i-2] && lows[i]<lows[i+1] && lows[i]<lows[i+2]) {
      sL.push({ idx:i, price:lows[i], rsi:rsiSeries[i-rOff] });
      if (sL.length>=2) break;
    }
  }
  if (sH.length>=2) {
    const [r,p] = sH;
    if (r.price>p.price && r.rsi<p.rsi && r.rsi!=null && p.rsi!=null)
      return { type:'BEARISH', detail:`Price HH but RSI LH (${r.rsi.toFixed(0)} < ${p.rsi.toFixed(0)})` };
  }
  if (sL.length>=2) {
    const [r,p] = sL;
    if (r.price<p.price && r.rsi>p.rsi && r.rsi!=null && p.rsi!=null)
      return { type:'BULLISH', detail:`Price LL but RSI HL (${r.rsi.toFixed(0)} > ${p.rsi.toFixed(0)})` };
  }
  return { type:'NONE', detail:null };
}

function countConsecutive(candles) {
  let count = 1;
  const isBull = parseFloat(candles[candles.length-1][4]) >= parseFloat(candles[candles.length-1][1]);
  for (let i=candles.length-2; i>=0; i--) {
    const cb = parseFloat(candles[i][4]) >= parseFloat(candles[i][1]);
    if (cb === isBull) count++; else break;
  }
  return { count, isBull };
}

function findRoundNumbers(price) {
  const mag = Math.pow(10, Math.floor(Math.log10(price))-1);
  const a = Math.ceil(price/mag)*mag, b = Math.floor(price/mag)*mag;
  const bm = mag*10;
  const ba = Math.ceil(price/bm)*bm, bb = Math.floor(price/bm)*bm;
  return [...new Set([b,a,bb,ba])].filter(n => Math.abs(n-price)/price < 0.05).sort((x,y)=>x-y);
}

function findLevels(candles) {
  const highs = candles.map(c=>parseFloat(c[2]));
  const lows = candles.map(c=>parseFloat(c[3]));
  const current = parseFloat(candles[candles.length-1][4]);
  const prevClose = parseFloat(candles[candles.length-2][4]);
  const direction = current > prevClose ? 'up' : 'down';
  const res=[], sup=[];
  for (let i=2; i<candles.length-2; i++) {
    if (highs[i]>highs[i-1] && highs[i]>highs[i-2] && highs[i]>highs[i+1] && highs[i]>highs[i+2]) res.push(highs[i]);
    if (lows[i]<lows[i-1] && lows[i]<lows[i-2] && lows[i]<lows[i+1] && lows[i]<lows[i+2]) sup.push(lows[i]);
  }
  return {
    resistances: res.filter(r=>r>current).sort((a,b)=>a-b).slice(0,2).map(p=>({price:p, touches:countTouches(candles,p)})),
    supports: sup.filter(s=>s<current).sort((a,b)=>b-a).slice(0,2).map(p=>({price:p, touches:countTouches(candles,p)})),
    current, direction
  };
}

function analyzeCandleShape(candle) {
  const o=parseFloat(candle[1]), h=parseFloat(candle[2]), l=parseFloat(candle[3]), c=parseFloat(candle[4]);
  const isBull = c>=o;
  const body = Math.abs(c-o), range = h-l;
  return {
    isBull, open:o, high:h, low:l, close:c,
    bodyPct: range>0 ? ((body/range)*100).toFixed(0) : 0,
    upperPct: range>0 ? (((h-Math.max(o,c))/range)*100).toFixed(0) : 0,
    lowerPct: range>0 ? (((Math.min(o,c)-l)/range)*100).toFixed(0) : 0,
    bodyAbs: body, range
  };
}

// ── CANDLE PATTERNS ──
function detectCandlePattern(current, prev) {
  if (!current) return null;
  const bp = parseFloat(current.bodyPct);
  const up = parseFloat(current.upperPct);
  const lp = parseFloat(current.lowerPct);

  // Doji: very small body
  if (bp <= 10) return { name: 'Doji', signal: 'بلاتکلیفی', cls: 'neu' };

  // Pin Bar bullish: large lower shadow, small upper
  if (lp >= 60 && bp <= 35 && up <= 15) return { name: 'Pin Bar ▲', signal: 'سیگنال صعودی', cls: 'pos' };
  // Pin Bar bearish
  if (up >= 60 && bp <= 35 && lp <= 15) return { name: 'Pin Bar ▼', signal: 'سیگنال نزولی', cls: 'neg' };

  // Engulfing
  if (prev && current.range > 0 && prev.range > 0) {
    if (current.isBull && !prev.isBull && current.open <= prev.close && current.close >= prev.open && current.bodyAbs > prev.bodyAbs)
      return { name: 'Engulfing ▲', signal: 'سیگنال صعودی قوی', cls: 'pos' };
    if (!current.isBull && prev.isBull && current.open >= prev.close && current.close <= prev.open && current.bodyAbs > prev.bodyAbs)
      return { name: 'Engulfing ▼', signal: 'سیگنال نزولی قوی', cls: 'neg' };
  }

  // Hammer: strong body with long lower shadow
  if (lp >= 50 && bp >= 20 && up <= 20 && current.isBull) return { name: 'Hammer ▲', signal: 'سیگنال صعودی', cls: 'pos' };
  // Shooting Star
  if (up >= 50 && bp >= 20 && lp <= 20 && !current.isBull) return { name: 'Shooting Star ▼', signal: 'سیگنال نزولی', cls: 'neg' };

  return null;
}

// ── MARKET REGIME ──
function detectRegime(t4h) {
  const bw = t4h.bb ? t4h.bb.bandwidth : 0;
  const emaSpread = Math.abs(t4h.ema20 - t4h.ema50) / t4h.price + Math.abs(t4h.ema50 - t4h.ema200) / t4h.price;
  // High bandwidth + spread EMAs = trending
  if (bw > 0.04 && emaSpread > 0.04) return { label: 'TRENDING', cls: 'pur', sub: 'ترند مشخص' };
  if (bw < 0.02 && emaSpread < 0.02) return { label: 'TIGHT RANGE', cls: 'neu', sub: 'رنج فشرده' };
  if (bw > 0.04) return { label: 'VOLATILE', cls: 'amber', sub: 'پر نوسان' };
  return { label: 'RANGE', cls: 'blu', sub: 'بازار رنج' };
}

// ── MARKET HOURS ──
function getMarketSession() {
  const h = new Date().getUTCHours();
  // Asia: 0-8, Europe: 7-16, US: 13-22
  // Best overlap: 13-16 UTC (Europe + US)
  if (h >= 13 && h < 16) return { label: 'لندن + نیویورک', cls: 'pos', quality: 'بهترین (high vol)' };
  if (h >= 7 && h < 13) return { label: 'لندن', cls: 'pur', quality: 'خوب' };
  if (h >= 16 && h < 22) return { label: 'نیویورک', cls: 'blu', quality: 'خوب' };
  if (h >= 0 && h < 7) return { label: 'آسیا', cls: 'neu', quality: 'متوسط' };
  return { label: 'بعد از بازار آمریکا', cls: 'neg', quality: 'حجم پایین' };
}

function trendLabel(price, e20, e50, e200) {
  if (price>e20 && e20>e50 && e50>e200) return { label:'BULLISH', cls:'pos' };
  if (price<e20 && e20<e50 && e50<e200) return { label:'BEARISH', cls:'neg' };
  return { label:'NEUTRAL', cls:'neu' };
}

function rsiColor(rsi) { if (rsi>70) return 'neg'; if (rsi<30) return 'pos'; if (rsi>60) return 'neu'; return ''; }

function fmt(n, d=2) {
  if (n===null || n===undefined || isNaN(n)) return '—';
  if (Math.abs(n)>1000) return n.toLocaleString('en-US', {maximumFractionDigits:0});
  return n.toFixed(d);
}
function pct(a,b) { return ((a-b)/b*100).toFixed(2); }
function pctNum(a,b) { return ((a-b)/b*100); }

// ── SETUP DETECTOR ──
function calculateSetup(d) {
  const t15 = d['15m'], t1 = d['1h'], t4 = d['4h'], t1d = d['1d'];
  const price = parseFloat(d.ticker.lastPrice);
  const checks = { long: [], short: [] };

  // 1. Trend alignment 4h + 1d
  const t4Bullish = t4.trend.label === 'BULLISH' || (t4.trend.label === 'NEUTRAL' && t4.ema20Pct > 0);
  const t1dBullish = t1d.trend.label === 'BULLISH' || (t1d.trend.label === 'NEUTRAL' && t1d.ema20Pct > -2);
  checks.long.push({ pass: t4Bullish && t1dBullish, weight: 15, label: 'ترند 4h و 1d صعودی', detail: `${t4.trend.label}/${t1d.trend.label}` });
  checks.short.push({ pass: !t4Bullish && !t1dBullish, weight: 15, label: 'ترند 4h و 1d نزولی', detail: `${t4.trend.label}/${t1d.trend.label}` });

  // 2. Near strong level (3+ touches)
  const nearSup = d.levels.supports.find(s => Math.abs((s.price-price)/price) < 0.015 && s.touches >= 3);
  const nearRes = d.levels.resistances.find(r => Math.abs((r.price-price)/price) < 0.015 && r.touches >= 3);
  checks.long.push({ pass: !!nearSup, weight: 15, label: 'نزدیک حمایت قوی', detail: nearSup ? `S $${fmt(nearSup.price)} (${nearSup.touches}×)` : 'سطح قوی نزدیک نیست' });
  checks.short.push({ pass: !!nearRes, weight: 15, label: 'نزدیک مقاومت قوی', detail: nearRes ? `R $${fmt(nearRes.price)} (${nearRes.touches}×)` : 'سطح قوی نزدیک نیست' });

  // 3. RSI not overbought/oversold
  const rsiOK_long = t15.rsi < 70 && t1.rsi < 75;
  const rsiOK_short = t15.rsi > 30 && t1.rsi > 25;
  checks.long.push({ pass: rsiOK_long, weight: 10, label: 'RSI اشباع خرید نیست', detail: `15m:${t15.rsi} 1h:${t1.rsi}` });
  checks.short.push({ pass: rsiOK_short, weight: 10, label: 'RSI اشباع فروش نیست', detail: `15m:${t15.rsi} 1h:${t1.rsi}` });

  // 4. Volume confirmation on 1h
  const volRatio1h = t1.curVol / t1.avgVol;
  checks.long.push({ pass: volRatio1h > 1.2, weight: 10, label: 'حجم 1h تأیید می‌کنه', detail: `${volRatio1h.toFixed(1)}x` });
  checks.short.push({ pass: volRatio1h > 1.2, weight: 10, label: 'حجم 1h تأیید می‌کنه', detail: `${volRatio1h.toFixed(1)}x` });

  // 5. MACD aligned
  checks.long.push({ pass: t1.macd > 0 && t4.macd > -Math.abs(t4.macd)*0.5, weight: 10, label: 'MACD صعودی (1h)', detail: t1.macd > 0 ? 'Bullish' : 'Bearish' });
  checks.short.push({ pass: t1.macd < 0 && t4.macd < Math.abs(t4.macd)*0.5, weight: 10, label: 'MACD نزولی (1h)', detail: t1.macd < 0 ? 'Bearish' : 'Bullish' });

  // 6. Price vs VWAP
  checks.long.push({ pass: t1.vwapPct > 0 && t4.vwapPct > -1, weight: 10, label: 'قیمت بالای VWAP', detail: `1h:${t1.vwapPct.toFixed(2)}% 4h:${t4.vwapPct.toFixed(2)}%` });
  checks.short.push({ pass: t1.vwapPct < 0 && t4.vwapPct < 1, weight: 10, label: 'قیمت پایین VWAP', detail: `1h:${t1.vwapPct.toFixed(2)}% 4h:${t4.vwapPct.toFixed(2)}%` });

  // 7. No bearish/bullish divergence against direction
  const noBearDiv = t4.divergence.type !== 'BEARISH' && t1.divergence.type !== 'BEARISH';
  const noBullDiv = t4.divergence.type !== 'BULLISH' && t1.divergence.type !== 'BULLISH';
  checks.long.push({ pass: noBearDiv, weight: 5, label: 'بدون واگرایی نزولی', detail: noBearDiv ? 'پاک' : 'واگرایی موجود ⚠' });
  checks.short.push({ pass: noBullDiv, weight: 5, label: 'بدون واگرایی صعودی', detail: noBullDiv ? 'پاک' : 'واگرایی موجود ⚠' });

  // 8. Not too many consecutive candles (no fatigue)
  const fatigue4h = t4.consec.count < 5;
  checks.long.push({ pass: fatigue4h || !t4.consec.isBull, weight: 10, label: 'بدون خستگی روند', detail: `${t4.consec.count}× ${t4.consec.isBull?'▲':'▼'}` });
  checks.short.push({ pass: fatigue4h || t4.consec.isBull, weight: 10, label: 'بدون خستگی روند', detail: `${t4.consec.count}× ${t4.consec.isBull?'▲':'▼'}` });

  // 9. Funding rate normal
  let fundingOK = true, fundingDetail = 'N/A';
  if (d.funding) {
    const fr = parseFloat(d.funding.lastFundingRate) * 100;
    fundingDetail = `${fr > 0 ? '+' : ''}${fr.toFixed(4)}%`;
    fundingOK = Math.abs(fr) < 0.05;
  }
  checks.long.push({ pass: fundingOK, weight: 5, label: 'Funding نرمال', detail: fundingDetail });
  checks.short.push({ pass: fundingOK, weight: 5, label: 'Funding نرمال', detail: fundingDetail });

  // 10. Candle pattern aligned
  const c4Pattern = detectCandlePattern(t4.last5Candles[4], t4.last5Candles[3]);
  const patternBull = c4Pattern && c4Pattern.cls === 'pos';
  const patternBear = c4Pattern && c4Pattern.cls === 'neg';
  checks.long.push({ pass: patternBull || (!c4Pattern), weight: 5, label: 'الگوی کندلی', detail: c4Pattern ? c4Pattern.name : 'خنثی' });
  checks.short.push({ pass: patternBear || (!c4Pattern), weight: 5, label: 'الگوی کندلی', detail: c4Pattern ? c4Pattern.name : 'خنثی' });

  // 11. R/R calculation
  const atr = t4.atr;
  // Long R/R: from price to nearest resistance / SL based on ATR
  const nextRes = d.levels.resistances[0]?.price;
  const nextSup = d.levels.supports[0]?.price;
  let rrLong = 0, rrShort = 0;
  if (nextRes && nextSup) {
    const slLong = price - atr * 1.5;
    const tpLong = nextRes;
    rrLong = slLong < price ? (tpLong - price) / (price - slLong) : 0;
    const slShort = price + atr * 1.5;
    const tpShort = nextSup;
    rrShort = slShort > price ? (price - tpShort) / (slShort - price) : 0;
  }
  checks.long.push({ pass: rrLong >= 2.5, weight: 5, label: 'R/R ≥ 2.5', detail: `${rrLong.toFixed(2)}:1` });
  checks.short.push({ pass: rrShort >= 2.5, weight: 5, label: 'R/R ≥ 2.5', detail: `${rrShort.toFixed(2)}:1` });

  // Calculate scores
  const score = (arr) => arr.reduce((s,c) => s + (c.pass ? c.weight : 0), 0);
  const longScore = score(checks.long);
  const shortScore = score(checks.short);

  // Choose direction
  let direction, finalScore, finalChecks;
  if (longScore > shortScore) { direction = 'LONG'; finalScore = longScore; finalChecks = checks.long; }
  else if (shortScore > longScore) { direction = 'SHORT'; finalScore = shortScore; finalChecks = checks.short; }
  else { direction = 'NEUTRAL'; finalScore = Math.max(longScore, shortScore); finalChecks = checks.long; }

  // Verdict
  let verdict, verdictCls;
  if (finalScore >= 80) { verdict = 'GO!'; verdictCls = 'pos'; }
  else if (finalScore >= 60) { verdict = 'با احتیاط'; verdictCls = 'neu'; }
  else if (finalScore >= 40) { verdict = 'ضعیف'; verdictCls = 'amber'; }
  else { verdict = 'وارد نشو'; verdictCls = 'neg'; }

  // Position sizing
  const capital = parseFloat(document.getElementById('capital').value) || 50;
  const riskPct = parseFloat(document.getElementById('riskPct').value) || 2.5;
  const riskUsd = capital * (riskPct/100);
  let positionSize = null;
  if (direction !== 'NEUTRAL' && atr) {
    const slDist = atr * 1.5;
    const slDistPct = (slDist / price) * 100;
    positionSize = {
      entry: price,
      sl: direction === 'LONG' ? price - slDist : price + slDist,
      tp1: direction === 'LONG' ? nextRes : nextSup,
      slDistPct,
      riskUsd,
      sizeUsd: (riskUsd / slDistPct) * 100,
      leverage: Math.min(10, Math.ceil((riskUsd / slDistPct) * 100 / capital))
    };
    if (positionSize.sizeUsd > capital * 10) positionSize.sizeUsd = capital * 10;
  }

  return { score: finalScore, direction, verdict, verdictCls, checks: finalChecks, longScore, shortScore, positionSize, rrLong, rrShort };
}

// ── FETCH ──
async function fetchKlines(s, i, lim=120) { const r = await fetch(`${BASE}/klines?symbol=${s}&interval=${i}&limit=${lim}`); return r.json(); }
async function fetchTicker(s) { const r = await fetch(`${BASE}/ticker/24hr?symbol=${s}`); return r.json(); }
async function fetchFunding(s) { try { const r = await fetch(`${FUT_BASE}/premiumIndex?symbol=${s}`); if (!r.ok) return null; return r.json(); } catch { return null; } }
async function fetchOpenInterest(s) { try { const r = await fetch(`${FUT_BASE}/openInterest?symbol=${s}`); if (!r.ok) return null; return r.json(); } catch { return null; } }

async function analyzeSymbol(symbol) {
  const [ticker, k15m, k1h, k4h, k1d, funding, oi] = await Promise.all([
    fetchTicker(symbol), fetchKlines(symbol,'15m'), fetchKlines(symbol,'1h'), fetchKlines(symbol,'4h'), fetchKlines(symbol,'1d',60),
    fetchFunding(symbol), fetchOpenInterest(symbol),
  ]);

  const analyze = (candles) => {
    const closes = candles.map(c=>parseFloat(c[4]));
    const highs = candles.map(c=>parseFloat(c[2]));
    const lows = candles.map(c=>parseFloat(c[3]));
    const volumes = candles.map(c=>parseFloat(c[5]));
    const price = closes[closes.length-1];
    const isOpen = candles[candles.length-1][6] > Date.now();
    const ema20 = calcEMA(closes.slice(-20),20), ema50 = calcEMA(closes.slice(-50),50), ema200 = calcEMA(closes,200);
    const rsiSeries = calcRSISeries(closes);
    const rsi = rsiSeries.length ? Math.round(rsiSeries[rsiSeries.length-1]) : null;
    const macd = calcMACD(closes), bb = calcBB(closes), atr = calcATR(candles);
    const avgVol = volumes.slice(-20).reduce((a,b)=>a+b,0)/20;
    const last5 = candles.slice(-5).map(analyzeCandleShape);
    const vwap = calcVWAP(candles,20);
    return {
      price, ema20, ema50, ema200,
      ema20Pct:pctNum(price,ema20), ema50Pct:pctNum(price,ema50), ema200Pct:pctNum(price,ema200),
      rsi, macd, bb, atr, atrPct:atr?(atr/price*100):null, avgVol, curVol:volumes[volumes.length-1],
      trend: trendLabel(price,ema20,ema50,ema200), last5Candles:last5, isOpen,
      divergence: detectDivergence(closes, highs, lows, rsiSeries),
      consec: countConsecutive(candles),
      vwap, vwapPct: vwap?pctNum(price,vwap):null,
      closes
    };
  };

  return {
    symbol, ticker, funding, oi,
    '15m': analyze(k15m), '1h': analyze(k1h), '4h': analyze(k4h), '1d': analyze(k1d),
    levels: findLevels(k4h),
    roundNumbers: findRoundNumbers(parseFloat(ticker.lastPrice)),
  };
}

      ${p.tp1 ? `<div class="ps-row"><span class="ps-label">TP1</span><span class="ps-val pos">$${fmt(p.tp1)}</span></div>` : ''}
      <hr class="ps-divider">

        ${patBadge ? `<div class="ind-row"><span class="ind-name">الگوی کندل</span>${patBadge}</div>` : ''}
        ${dB || patBadge ? '<hr class="section-divider">' : ''}
        <div class="ind-row"><span class="ind-name">RSI(14)</span><span class="ind-val ${rsiColor(t.rsi)}">${t.rsi??'—'} ${t.rsi>70?'⚠':''}${t.rsi<30?'⚠':''}</span></div>
        <div class="ind-row"><span class="ind-name">ATR(14)</span><span class="ind-val pur">${fmt(t.atr)} (${t.atrPct?.toFixed(2)}%)</span></div>
        <hr class="section-divider">
        <div class="ind-row"><span class="ind-name">EMA 20</span><span class="ind-val ${t.ema20Pct>=0?'pos':'neg'}">${fmt(t.ema20)} (${t.ema20Pct>=0?'+':''}${t.ema20Pct.toFixed(2)}%)</span></div>
        <div class="ind-row"><span class="ind-name">EMA 50</span><span class="ind-val ${t.ema50Pct>=0?'pos':'neg'}">${fmt(t.ema50)} (${t.ema50Pct>=0?'+':''}${t.ema50Pct.toFixed(2)}%)</span></div>
        <div class="ind-row"><span class="ind-name">EMA 200</span><span class="ind-val ${t.ema200Pct>=0?'pos':'neg'}">${fmt(t.ema200)} (${t.ema200Pct>=0?'+':''}${t.ema200Pct.toFixed(2)}%)</span></div>
        <div class="ind-row"><span class="ind-name">VWAP(20)</span><span class="ind-val ${t.vwapPct>=0?'pos':'neg'}">${fmt(t.vwap)} (${t.vwapPct>=0?'+':''}${t.vwapPct?.toFixed(2)}%)</span></div>
        <hr class="section-divider">
        <div class="ind-row"><span class="ind-name">MACD</span><span class="ind-val">${macdDir}</span></div>
        <div class="ind-row"><span class="ind-name">Bollinger</span><span class="ind-val">${bbPos}</span></div>
        <hr class="section-divider">
        <div class="ind-row"><span class="ind-name">حجم</span><span class="ind-val ${volCls}">${volR}x</span></div>
        <div class="ind-row"><span class="ind-name">کندل متوالی</span><span class="ind-val ${t.consec.count>=5?'neu':''}">${t.consec.count}x ${t.consec.isBull?'▲':'▼'} ${t.consec.count>=5?'⚠':''}</span></div>
      </div>
    </div>`;
  }).join('');

  const t4 = d['4h'];
  let candlesHtml = '';
  if (t4?.last5Candles) {
    const rows = t4.last5Candles.map((c,i) => {
      const lbl = i===4 ? (t4.isOpen?'فعلی (باز)':'فعلی') : `کندل -${4-i}`;
      const cls = c.isBull?'candle-bull':'candle-bear';
      const chg = ((c.close-c.open)/c.open*100).toFixed(2);
      return `<tr><td style="color:var(--muted)">${lbl}</td><td class="${cls}">${c.isBull?'▲':'▼'}</td><td>${fmt(c.open)}</td><td>${fmt(c.high)}</td><td>${fmt(c.low)}</td><td class="${cls}">${fmt(c.close)}</td><td class="${cls}">${chg>0?'+':''}${chg}%</td><td style="color:var(--muted2)">${c.upperPct}/${c.bodyPct}/${c.lowerPct}</td></tr>`;
    }).join('');
    candlesHtml = `<div class="candles-card"><div class="candles-title">۵ کندل آخر — 4H (سایه‌بالا/بدنه/سایه‌پایین %)</div><div style="overflow-x:auto;"><table class="candles-table"><thead><tr><th>کندل</th><th></th><th>Open</th><th>High</th><th>Low</th><th>Close</th><th>تغییر</th><th>U/B/L</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }

  const levels = d.levels;
  let levelsHtml = '';
  levels.resistances.forEach((r,i) => {
    const dist = pct(r.price, price);
    const appr = levels.direction==='up'?'<span class="neg">→ نزدیک شدن</span>':'<span style="color:var(--muted2)">← دور شدن</span>';
    const str = r.touches>=3?`<span class="neu" style="font-size:10px;padding:1px 5px;border-radius:2px;margin-right:4px">${r.touches}× ⚠</span>`:`<span style="color:var(--muted);font-size:10px">${r.touches}×</span>`;
    levelsHtml += `<div class="level-row"><span class="level-type" style="color:var(--red)">مقاومت ${i+1} ${str}</span><div class="level-bar"><div class="level-fill" style="width:${Math.min(100,Math.abs(parseFloat(dist))*15)}%;background:var(--red)"></div></div><span class="level-price" style="color:var(--red)">$${fmt(r.price)}</span><span class="level-dist">+${dist}%</span><span class="level-dir">${appr}</span></div>`;
  });
  d.roundNumbers.forEach(rn => {
    if (Math.abs(rn-price)/price<0.001) return;
    const dist = pct(rn, price);
    levelsHtml += `<div class="level-row"><span class="level-type pur" style="background:transparent;padding:0">عدد رند</span><div class="level-bar"><div class="level-fill" style="width:${Math.min(100,Math.abs(parseFloat(dist))*15)}%;background:var(--purple)"></div></div><span class="level-price pur" style="background:transparent;padding:0">$${fmt(rn)}</span><span class="level-dist">${rn>price?'+':''}${dist}%</span><span class="level-dir" style="color:var(--muted2)">روانی</span></div>`;
  });
  levelsHtml += `<div class="level-row"><span class="level-type" style="color:var(--accent)">قیمت</span><div class="level-bar"><div class="level-fill" style="width:50%;background:var(--accent)"></div></div><span class="level-price" style="color:var(--accent)">$${fmt(price)}</span><span class="level-dist">—</span><span class="level-dir" style="color:var(--muted2)">${levels.direction==='up'?'↑':'↓'}</span></div>`;
  levels.supports.forEach((s,i) => {
    const dist = pct(s.price, price);
    const appr = levels.direction==='down'?'<span class="pos">→ نزدیک شدن</span>':'<span style="color:var(--muted2)">← دور شدن</span>';
    const str = s.touches>=3?`<span class="neu" style="font-size:10px;padding:1px 5px;border-radius:2px;margin-right:4px">${s.touches}× ⚠</span>`:`<span style="color:var(--muted);font-size:10px">${s.touches}×</span>`;
    levelsHtml += `<div class="level-row"><span class="level-type" style="color:var(--green)">حمایت ${i+1} ${str}</span><div class="level-bar"><div class="level-fill" style="width:${Math.min(100,Math.abs(parseFloat(dist))*15)}%;background:var(--green)"></div></div><span class="level-price" style="color:var(--green)">$${fmt(s.price)}</span><span class="level-dist">${dist}%</span><span class="level-dir">${appr}</span></div>`;
  });

  const report = generateReport(d, setup);

  return `<div class="symbol-section" id="sym-${d.symbol}">
    <div class="symbol-header">
      <span class="symbol-name">${d.symbol.replace('USDT','')}<span style="color:var(--muted);font-weight:300">/USDT</span></span>
      <span class="symbol-price">$${fmt(price)}</span>
      <span class="symbol-change ${changeCls}">${change>0?'+':''}${change.toFixed(2)}%</span>
      ${d.symbol!=='BTCUSDT' && d.btcCorrelation!=null?`<span class="symbol-change ${Math.abs(d.btcCorrelation)>0.7?'pur':'neu'}" title="همبستگی با BTC در 4h">⛓ ${d.btcCorrelation.toFixed(2)}</span>`:''}
      <span class="symbol-meta">H:$${fmt(parseFloat(d.ticker.highPrice))} | L:$${fmt(parseFloat(d.ticker.lowPrice))}</span>
    </div>
    ${renderSetupDetector(d, setup)}
    ${futuresHtml}
    <div class="tf-grid">${tfCards}</div>
    ${candlesHtml}
    <div class="levels-card"><div class="levels-title">سطوح کلیدی (4h) + اعداد رند</div>${levelsHtml}</div>
    <div class="copy-section">
      <div class="copy-header"><span class="copy-title">◈ گزارش برای Claude</span><button class="copy-btn" onclick="copyReport('${d.symbol}')">کپی کردن</button></div>
      <div id="copyOutput-${d.symbol}" style="padding:14px;font-family:var(--font-mono);font-size:11px;color:var(--muted2);line-height:1.8;white-space:pre-wrap;max-height:300px;overflow-y:auto;">${report}</div>
    </div>
  </div>`;
}

function generateReport(d, setup) {
  const price = parseFloat(d.ticker.lastPrice);
  const change = parseFloat(d.ticker.priceChangePercent);
  const now = new Date().toUTCString();
  const tfs = ['15m','1h','4h','1d'];

  let setupLine = `\n── SETUP DETECTOR ──\nScore       : ${setup.score}/100 (Long:${setup.longScore}, Short:${setup.shortScore})\nDirection   : ${setup.direction}\nVerdict     : ${setup.verdict}\nFailed Checks:\n${setup.checks.filter(c=>!c.pass).map(c=>`  ✗ ${c.label} (${c.detail})`).join('\n') || '  (همه پاس)'}`;
  if (setup.positionSize) {
    const p = setup.positionSize;
    setupLine += `\n\n── POSITION SIZE (پیشنهادی) ──\nEntry       : $${fmt(p.entry)}\nSL          : $${fmt(p.sl)} (${p.slDistPct.toFixed(2)}%)\nTP1         : $${fmt(p.tp1 || 0)}\nRisk        : $${p.riskUsd.toFixed(2)}\nSize        : $${p.sizeUsd.toFixed(2)} (${p.leverage}x leverage)`;
  }

  let futuresLine = '';
  if (d.funding && d.oi) {
    const fr = parseFloat(d.funding.lastFundingRate)*100;
    const oiV = parseFloat(d.oi.openInterest);
    futuresLine = `\n── FUTURES ──\nFunding     : ${fr>0?'+':''}${fr.toFixed(4)}%\nOpen Int.   : ${oiV.toLocaleString('en-US',{maximumFractionDigits:0})} ($${(oiV*price/1e9).toFixed(2)}B)`;
  }

  let tfLines = tfs.map(tf => {
    const t = d[tf]; if (!t) return '';
    const macdDir = t.macd>0?'Bullish':'Bearish';
    const bbPos = t.bb?(price>t.bb.upper?'Above Upper ⚠':price<t.bb.lower?'Below Lower ⚠':'Inside'):'N/A';
    const volR = (t.curVol/t.avgVol).toFixed(1);
    const cs = t.isOpen?'OPEN':'CLOSED';
    const lc = t.last5Candles[4];
    const lcChg = ((lc.close-lc.open)/lc.open*100).toFixed(2);
    const pat = detectCandlePattern(t.last5Candles[4], t.last5Candles[3]);
    let divLine = ''; if (t.divergence.type!=='NONE') divLine = `\nDivergence  : ⚠ ${t.divergence.type} — ${t.divergence.detail}`;
    let patLine = pat ? `\nPattern     : ${pat.name} (${pat.signal})` : '';
    return `
── ${tf.toUpperCase()} ──
Candle      : ${cs} | ${lc.isBull?'▲':'▼'} Chg:${lcChg>0?'+':''}${lcChg}% | U/B/L: ${lc.upperPct}/${lc.bodyPct}/${lc.lowerPct}${patLine}
Trend       : ${t.trend.label}
RSI(14)     : ${t.rsi??'N/A'}${t.rsi>70?' ⚠':''}${t.rsi<30?' ⚠':''}${divLine}
ATR(14)     : ${fmt(t.atr)} (${t.atrPct?.toFixed(2)}%)
EMA 20/50/200: ${fmt(t.ema20)} (${t.ema20Pct>=0?'+':''}${t.ema20Pct.toFixed(2)}%) / ${fmt(t.ema50)} (${t.ema50Pct>=0?'+':''}${t.ema50Pct.toFixed(2)}%) / ${fmt(t.ema200)} (${t.ema200Pct>=0?'+':''}${t.ema200Pct.toFixed(2)}%)
VWAP(20)    : ${fmt(t.vwap)} (${t.vwapPct>=0?'+':''}${t.vwapPct?.toFixed(2)}%)
MACD        : ${macdDir} (${fmt(t.macd,4)})
Bollinger   : ${bbPos}
Volume      : ${volR}x avg
Consecutive : ${t.consec.count}x ${t.consec.isBull?'▲':'▼'}${t.consec.count>=5?' ⚠ خستگی':''}`;
  }).join('');

  const t4h = d['4h'];
  let candleLines = '\n── 4H LAST 5 CANDLES ──\n';
  t4h.last5Candles.forEach((c,i) => {
    const lbl = i===4 ? (t4h.isOpen?'Current(OPEN)':'Current') : `Candle-${4-i}`;
    const chg = ((c.close-c.open)/c.open*100).toFixed(2);
    candleLines += `${lbl.padEnd(14)}: ${c.isBull?'▲':'▼'} O:${fmt(c.open)} H:${fmt(c.high)} L:${fmt(c.low)} C:${fmt(c.close)} | Chg:${chg>0?'+':''}${chg}% | U/B/L:${c.upperPct}/${c.bodyPct}/${c.lowerPct}\n`;
  });

  const levels = d.levels;
  const res = levels.resistances.map((r,i)=>`  R${i+1}: $${fmt(r.price)} (+${pct(r.price,price)}%) — ${r.touches}× tested${r.touches>=3?' ⚠ قوی':''}`).join('\n');
  const sup = levels.supports.map((s,i)=>`  S${i+1}: $${fmt(s.price)} (${pct(s.price,price)}%) — ${s.touches}× tested${s.touches>=3?' ⚠ قوی':''}`).join('\n');
  const round = d.roundNumbers.map(rn=>`  $${fmt(rn)} (${rn>price?'+':''}${pct(rn,price)}%)`).join('\n');

  let corrLine = '';
  if (d.btcCorrelation!=null) corrLine = `\n── BTC CORRELATION (4h) ──\nCorrelation: ${d.btcCorrelation.toFixed(2)}\n`;

  return `═══════════════════════════════════
ANALYSIS REQUEST
═══════════════════════════════════
Symbol      : ${d.symbol}
Time        : ${now}
Price       : $${fmt(price)}
24h Change  : ${change>0?'+':''}${change.toFixed(2)}%
${setupLine}
${futuresLine}
${tfLines}
${candleLines}
── KEY LEVELS (4h) ──
Resistances:
${res || '  N/A'}
Supports:
${sup || '  N/A'}

── ROUND NUMBERS ──
${round || '  N/A'}
${corrLine}
═══════════════════════════════════`;
}

function copyReport(symbol) {
  const el = document.getElementById(`copyOutput-${symbol}`);
  navigator.clipboard.writeText(el.textContent).then(() => {
    const btn = document.querySelector(`#sym-${symbol} .copy-btn`);
    if (btn) { btn.textContent = '✓ کپی شد'; btn.classList.add('copied'); setTimeout(()=>{btn.textContent='کپی کردن'; btn.classList.remove('copied');}, 2000); }
  });
}

async function renderMarketContext(symbolData) {
  try {
    const btc = symbolData.find(d=>d.symbol==='BTCUSDT');
    const eth = symbolData.find(d=>d.symbol==='ETHUSDT');
    const btcChg = btc?parseFloat(btc.ticker.priceChangePercent):0;
    const ethChg = eth?parseFloat(eth.ticker.priceChangePercent):0;
    const sentiment = btcChg>2?'BULLISH':btcChg<-2?'BEARISH':'NEUTRAL';
    const sentCls = btcChg>2?'pos':btcChg<-2?'neg':'neu';
    const regime = btc ? detectRegime(btc['4h']) : { label:'N/A', cls:'neu', sub:'-' };
    const session = getMarketSession();

    return `<div class="market-context">
      <div class="ctx-card"><div class="ctx-label">بازار کلی (BTC)</div><div class="ctx-value ${sentCls}">${sentiment}</div><div class="ctx-sub">${btcChg>0?'+':''}${btcChg.toFixed(2)}%</div></div>
      <div class="ctx-card"><div class="ctx-label">رژیم بازار</div><div class="ctx-value ${regime.cls}">${regime.label}</div><div class="ctx-sub">${regime.sub}</div></div>
      <div class="ctx-card"><div class="ctx-label">سشن فعلی</div><div class="ctx-value ${session.cls}">${session.label}</div><div class="ctx-sub">${session.quality}</div></div>
      <div class="ctx-card"><div class="ctx-label">قدرت نسبی ETH/BTC</div><div class="ctx-value ${(ethChg-btcChg)>0.5?'pos':(ethChg-btcChg)<-0.5?'neg':'neu'}">${(ethChg-btcChg)>0.5?'ETH قوی‌تر':(ethChg-btcChg)<-0.5?'BTC قوی‌تر':'هم‌راستا'}</div><div class="ctx-sub">${(ethChg-btcChg)>0?'+':''}${(ethChg-btcChg).toFixed(2)}%</div></div>
    </div>`;
  } catch { return ''; }
}

// ── ALERT SYSTEM ──
function playAlertSound() {
  if (!document.getElementById('soundToggle').checked) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.2, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    o.start(); o.stop(ctx.currentTime + 0.5);
  } catch {}
}

function triggerAlert(symbols) {
  const banner = document.getElementById('alertBanner');
  banner.textContent = `🚨 Setup قوی پیدا شد: ${symbols.join(', ')}`;
  banner.style.display = 'block';
  document.title = `🚨 Setup! — Trade Intel`;
  playAlertSound();
  setTimeout(()=>{ banner.style.display = 'none'; document.title = 'Trading Analysis Dashboard'; }, 30000);
}

async function refreshAll() {
  const main = document.getElementById('mainContent');
  main.innerHTML = '<div class="loading">در حال بارگذاری... <span class="spinner"></span></div>';
  try {
    const symbolData = await Promise.all(symbols.map(s=>analyzeSymbol(s)));

    // BTC correlation
    const btcData = symbolData.find(d=>d.symbol==='BTCUSDT');
    if (btcData?.['4h']?.closes) {
      symbolData.forEach(d => {
        if (d.symbol==='BTCUSDT') d.btcCorrelation = 1.0;
        else if (d['4h']?.closes) {
          const bC = btcData['4h'].closes.slice(-50), sC = d['4h'].closes.slice(-50);
          const bR = [], sR = []; const len = Math.min(bC.length, sC.length);
          for (let i=1; i<len; i++) {
            bR.push((bC[i]-bC[i-1])/bC[i-1]);
            sR.push((sC[i]-sC[i-1])/sC[i-1]);
          }
          d.btcCorrelation = calcCorrelation(bR, sR);
        }
      });
    }

    // Calculate setups
    const setups = symbolData.map(d => ({ d, setup: calculateSetup(d) }));

    const ctxHtml = await renderMarketContext(symbolData);
    main.innerHTML = ctxHtml + setups.map(({d, setup}) => renderSymbol(d, setup)).join('<hr class="divider">');
    document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('fa-IR');

    // Check for new strong setups
    const strong = setups.filter(({d, setup}) => {
      const wasStrong = (lastAlertScores[d.symbol] || 0) >= 80;
      const isStrong = setup.score >= 80;
      const updated = isStrong && !wasStrong;
      lastAlertScores[d.symbol] = setup.score;
      return updated;
    });
    if (strong.length > 0) triggerAlert(strong.map(({d}) => d.symbol.replace('USDT','')));
  } catch (e) {
    main.innerHTML = `<div class="loading">خطا: ${e.message}</div>`;
  }
}

function renderSymbolTags() {
  document.getElementById('symbolTags').innerHTML = symbols.map(s=>`<div class="symbol-tag active"><span>${s.replace('USDT','')}</span><span class="remove" onclick="removeSymbol('${s}')">×</span></div>`).join('');
}

function addSymbol() {
  let v = document.getElementById('newSymbol').value.toUpperCase().trim();
  if (!v) return;
  if (!v.endsWith('USDT')) v += 'USDT';
  if (!symbols.includes(v)) { symbols.push(v); renderSymbolTags(); refreshAll(); }
  document.getElementById('newSymbol').value = '';
}

function removeSymbol(s) {
  symbols = symbols.filter(x=>x!==s);
  renderSymbolTags();
  const el = document.getElementById(`sym-${s}`);
  if (el) el.remove();
}

function toggleTF(btn) {
  const tf = btn.dataset.tf;
  if (btn.classList.contains('active')) { if (activeTFs.length>1) { activeTFs = activeTFs.filter(t=>t!==tf); btn.classList.remove('active'); } }
  else { activeTFs.push(tf); btn.classList.add('active'); }
  refreshAll();
}

document.getElementById('newSymbol').addEventListener('keydown', e=>{ if (e.key==='Enter') addSymbol(); });
document.getElementById('capital').addEventListener('change', refreshAll);
document.getElementById('riskPct').addEventListener('change', refreshAll);

renderSymbolTags();
refreshAll();
setInterval(refreshAll, 60000);
</script>
