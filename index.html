<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Intel</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
<style>
  :root[data-theme="light"] {
    --bg: #f5f5f7; --bg-card: #ffffff; --bg-elevated: #ffffff; --bg-input: #f5f5f7;
    --bg-hover: rgba(0,0,0,0.04); --border: rgba(0,0,0,0.08); --border-strong: rgba(0,0,0,0.15);
    --text: #1d1d1f; --text-secondary: #515154; --muted: #86868b; --muted-soft: #a1a1a6;
    --accent: #007AFF; --accent-soft: rgba(0,122,255,0.12);
    --green: #34c759; --green-soft: rgba(52,199,89,0.15);
    --red: #ff3b30; --red-soft: rgba(255,59,48,0.15);
    --amber: #ff9500; --amber-soft: rgba(255,149,0,0.15);
    --purple: #af52de; --purple-soft: rgba(175,82,222,0.15);
    --blue: #5856d6; --blue-soft: rgba(88,86,214,0.15);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
    --shadow-lg: 0 6px 20px rgba(0,0,0,0.08);
  }
  :root[data-theme="dark"] {
    --bg: #000; --bg-card: #1c1c1e; --bg-elevated: #2c2c2e; --bg-input: #1c1c1e;
    --bg-hover: rgba(255,255,255,0.06); --border: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.15);
    --text: #fff; --text-secondary: rgba(235,235,245,0.8); --muted: rgba(235,235,245,0.6); --muted-soft: rgba(235,235,245,0.4);
    --accent: #0a84ff; --accent-soft: rgba(10,132,255,0.18);
    --green: #30d158; --green-soft: rgba(48,209,88,0.18);
    --red: #ff453a; --red-soft: rgba(255,69,58,0.18);
    --amber: #ff9f0a; --amber-soft: rgba(255,159,10,0.18);
    --purple: #bf5af2; --purple-soft: rgba(191,90,242,0.18);
    --blue: #5e5ce6; --blue-soft: rgba(94,92,230,0.18);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-md: 0 2px 8px rgba(0,0,0,0.4);
    --shadow-lg: 0 6px 20px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    min-height: 100vh; transition: background 0.3s, color 0.3s;
    font-feature-settings: 'tnum';
  }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .neu { color: var(--amber); }
  .pur { color: var(--purple); }
  .blu { color: var(--blue); }
  .bg-pos { background: var(--green-soft); color: var(--green); }
  .bg-neg { background: var(--red-soft); color: var(--red); }
  .bg-neu { background: var(--amber-soft); color: var(--amber); }
  .bg-pur { background: var(--purple-soft); color: var(--purple); }
  .bg-blu { background: var(--blue-soft); color: var(--blue); }

  /* HEADER */
  header {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 10px 16px; background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100; backdrop-filter: blur(20px);
  }
  .header-left { display: flex; align-items: center; gap: 8px; justify-self: start; }
  .header-right { display: flex; align-items: center; gap: 8px; justify-self: end; }
  .logo-center { display: flex; align-items: center; gap: 10px; justify-self: center; }
  .logo-mark {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 18px; letter-spacing: -0.5px;
    box-shadow: 0 4px 12px var(--accent-soft);
  }
  .logo-text {
    font-size: 22px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .status-indicator { display: flex; align-items: center; gap: 6px; padding: 6px 12px;
    background: var(--green-soft); border-radius: 100px; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .status-text { font-size: 11px; color: var(--green); font-weight: 500; }
  #lastUpdate { font-size: 12px; color: var(--muted); }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 10px; border: none;
    background: var(--bg-hover); color: var(--text); cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 16px;
    transition: all 0.15s;
  }
  .icon-btn:hover { background: var(--border); }

  /* ALERT BANNER */
  .alert-banner { display: none; padding: 14px 20px; background: var(--green-soft); border-bottom: 1px solid var(--green);
    color: var(--green); font-size: 13px; font-weight: 600; }

  /* OVERVIEW ROW — vertical list, same shape as watchlist */
  .overview-section { padding: 0; }
  .section-title { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 8px; padding: 0 4px; }
  .overview-row {
    display: flex; flex-direction: column; gap: 2px;
    max-height: 360px; overflow-y: auto; padding: 4px;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: var(--shadow-sm);
  }
  .overview-row::-webkit-scrollbar { width: 6px; }
  .overview-row::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
  .overview-card {
    display: flex; align-items: center; gap: 8px; padding: 4px 8px;
    border-radius: 8px; cursor: pointer; transition: all 0.15s;
    background: transparent; border: none; min-width: 0;
  }
  .overview-card:hover { background: var(--bg-hover); }
  .overview-card-logo { width: 20px; height: 20px; border-radius: 50%; background: var(--bg-input);
    display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
  .overview-card-logo img { width: 100%; height: 100%; object-fit: cover; }
  .overview-info { display: flex; flex-direction: column; gap: 0; flex: 1; min-width: 0; line-height: 1.1; }
  .overview-name { font-size: 11px; font-weight: 700; color: var(--text); }
  .overview-fullname { font-size: 9px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .overview-score-mini { width: 30px; height: 30px; position: relative; flex-shrink: 0; }
  .overview-score-mini svg { transform: rotate(-90deg); }
  .overview-score-mini .num { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 10px; font-weight: 700; font-feature-settings: 'tnum'; }
  .overview-price-info { display: flex; flex-direction: column; gap: 0; align-items: flex-start; min-width: 52px; line-height: 1.1; }
  .overview-price-val { font-size: 10px; font-weight: 600; font-feature-settings: 'tnum'; }
  .overview-change-val { font-size: 9px; font-weight: 600; font-feature-settings: 'tnum'; }
  .overview-direction { padding: 2px 7px; border-radius: 100px; font-size: 9px; font-weight: 700; letter-spacing: 0.2px; flex-shrink: 0; }
  .overview-card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
    padding: 9px; cursor: pointer; transition: all 0.2s; min-width: 118px; flex: 0 0 auto;
    box-shadow: var(--shadow-sm); display: flex; flex-direction: column; align-items: center; gap: 5px;
  }
  .overview-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: var(--border-strong); }
  .overview-coin-row { display: flex; align-items: center; gap: 6px; }
  .overview-logo { width: 18px; height: 18px; border-radius: 50%; background: var(--bg-input);
    display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
  .overview-logo img { width: 100%; height: 100%; object-fit: cover; }
  .overview-logo-fallback { font-size: 8px; font-weight: 700; color: var(--text-secondary); }
  .overview-name { font-size: 12px; font-weight: 600; color: var(--text); }
  .score-ring-small { width: 52px; height: 52px; position: relative; }
  .score-ring-small svg { transform: rotate(-90deg); }
  .score-ring-small .score-num { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-size: 15px; font-weight: 700; font-feature-settings: 'tnum'; }
  .overview-price { font-size: 11px; color: var(--text-secondary); font-weight: 500; font-feature-settings: 'tnum'; }
  .overview-direction { padding: 2px 8px; border-radius: 100px; font-size: 9px; font-weight: 700; letter-spacing: 0.5px; }

  /* WATCHLIST */
  .watchlist-section { padding: 0 14px 12px; }
  .watchlist-container { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; box-shadow: var(--shadow-sm); }
  .watchlist-header {
    padding: 10px 14px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  .watchlist-title { font-size: 13px; font-weight: 600; color: var(--text); }
  .search-wrap { position: relative; flex: 1; max-width: 360px; margin-right: auto; }
  .search-input {
    width: 100%; padding: 7px 32px 7px 12px; background: var(--bg-input);
    border: 1px solid var(--border); border-radius: 9px; color: var(--text);
    font-family: inherit; font-size: 12px; outline: none; transition: all 0.15s;
  }
  .search-input:focus { border-color: var(--accent); background: var(--bg-card); }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-size: 13px; pointer-events: none; }
  .search-results {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: var(--shadow-lg); max-height: 260px; overflow-y: auto; z-index: 50;
    display: none;
  }
  .search-results.active { display: block; }
  .search-result-item {
    padding: 7px 12px; display: flex; align-items: center; gap: 9px; cursor: pointer;
    transition: background 0.1s;
  }
  .search-result-item:hover, .search-result-item.highlighted { background: var(--bg-hover); }
  .search-result-logo { width: 22px; height: 22px; border-radius: 50%; background: var(--bg-input);
    display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
  .search-result-logo img { width: 100%; height: 100%; object-fit: cover; }
  .search-result-info { flex: 1; display: flex; flex-direction: column; gap: 1px; }
  .search-result-symbol { font-size: 12px; font-weight: 600; color: var(--text); }
  .search-result-pair { font-size: 10px; color: var(--muted); }
  .search-result-add { color: var(--accent); font-size: 15px; }
  .watchlist-list { padding: 4px; max-height: 240px; overflow-y: auto; }
  .watchlist-list::-webkit-scrollbar { width: 6px; }
  .watchlist-list::-webkit-scrollbar-track { background: transparent; }
  .watchlist-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
  .watchlist-item {
    display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px;
    cursor: grab; transition: background 0.15s;
  }
  .watchlist-item:hover { background: var(--bg-hover); }
  .watchlist-item.sortable-ghost { opacity: 0.4; background: var(--accent-soft); }
  .watchlist-item.sortable-chosen { cursor: grabbing; }
  .drag-handle { color: var(--muted-soft); font-size: 13px; line-height: 1; cursor: grab; user-select: none; }
  .watchlist-logo { width: 26px; height: 26px; border-radius: 50%; background: var(--bg-input);
    display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
  .watchlist-logo img { width: 100%; height: 100%; object-fit: cover; }
  .watchlist-info { flex: 1; display: flex; flex-direction: column; }
  .watchlist-symbol { font-size: 13px; font-weight: 600; color: var(--text); }
  .watchlist-pair { font-size: 10px; color: var(--muted); }
  .watchlist-remove { color: var(--muted); cursor: pointer; padding: 3px 7px; border-radius: 6px;
    transition: all 0.15s; font-size: 16px; line-height: 1; }
  .watchlist-remove:hover { background: var(--red-soft); color: var(--red); }

  /* SETTINGS BAR */
  .settings-bar { padding: 0 14px 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .setting-pill { display: flex; align-items: center; gap: 7px; padding: 6px 11px;
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 100px; box-shadow: var(--shadow-sm); }
  .setting-label { font-size: 11px; color: var(--muted); font-weight: 500; }
  .setting-input { width: 56px; padding: 1px 4px; background: transparent; border: none;
    color: var(--text); font-family: inherit; font-size: 12px; font-weight: 600; outline: none; text-align: center; }
  .tf-group { display: flex; gap: 3px; background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 100px; padding: 3px; box-shadow: var(--shadow-sm); }
  .tf-btn { padding: 4px 11px; border-radius: 100px; border: none; background: transparent;
    color: var(--muted); cursor: pointer; font-family: inherit; font-size: 11px; font-weight: 600; transition: all 0.15s; }
  .tf-btn.active { background: var(--accent); color: #fff; }
  .btn { padding: 7px 12px; border-radius: 100px; border: 1px solid var(--border); background: var(--bg-card);
    color: var(--text); cursor: pointer; font-family: inherit; font-size: 11px; font-weight: 600;
    box-shadow: var(--shadow-sm); transition: all 0.15s; }
  .btn:hover { border-color: var(--border-strong); transform: translateY(-1px); }
  .btn-accent { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* MARKET CONTEXT */
  .context-section { padding: 0 14px 12px; }
  .market-context { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; }
  .ctx-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 12px; box-shadow: var(--shadow-sm); }
  .ctx-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; font-weight: 600; }
  .ctx-value { font-size: 16px; font-weight: 700; }
  .ctx-sub { font-size: 10px; color: var(--muted); margin-top: 2px; font-feature-settings: 'tnum'; }

  /* SCANNER */
  .scanner-section { padding: 0 14px 12px; }
  .scanner-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px; box-shadow: var(--shadow-sm); }
  .scanner-card.compact { padding: 10px 12px; }
  .scanner-header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .scanner-title-row { display: flex; align-items: center; gap: 8px; flex: 1; }
  .scanner-title { font-size: 13px; font-weight: 700; color: var(--text); }
  .scanner-subtitle { font-size: 11px; color: var(--muted); }
  .scan-progress { display: none; height: 3px; background: var(--bg-input); border-radius: 2px;
    overflow: hidden; margin-bottom: 8px; }
  .scan-progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; border-radius: 2px; }
  .scan-results { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
  .scan-result-card {
    background: var(--bg-input); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 10px; display: flex; flex-direction: column; gap: 4px;
  }
  .scan-result-top { display: flex; align-items: center; justify-content: space-between; }
  .scan-result-name { font-size: 12px; font-weight: 700; }
  .scan-result-fullname { font-size: 10px; color: var(--muted); }
  .scan-result-score { font-size: 15px; font-weight: 700; font-feature-settings: 'tnum'; }
  .scan-result-row { display: flex; align-items: center; justify-content: space-between; font-size: 10px; font-feature-settings: 'tnum'; }
  .scan-empty { padding: 18px; text-align: center; color: var(--muted); font-size: 12px; grid-column: 1/-1; }

  /* MAIN CONTENT — coins flow in vertical columns */
  main {
    padding: 0 14px 18px;
    column-count: 2;
    column-gap: 12px;
  }
  @media (max-width: 1100px) { main { column-count: 1; } }
  .symbol-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
    overflow: hidden; box-shadow: var(--shadow-sm);
    break-inside: avoid; margin-bottom: 12px;
    display: inline-block; width: 100%;
  }
  .symbol-body { display: flex; flex-direction: column; }
  .symbol-header {
    display: flex; align-items: center; gap: 9px; padding: 12px 14px;
    border-bottom: 1px solid var(--border); flex-wrap: wrap;
  }
  .symbol-header-logo { width: 32px; height: 32px; border-radius: 50%; background: var(--bg-input);
    display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
  .symbol-header-logo img { width: 100%; height: 100%; object-fit: cover; }
  .symbol-name { font-size: 15px; font-weight: 700; }
  .symbol-name .pair { color: var(--muted); font-weight: 400; }
  .symbol-price { font-size: 18px; font-weight: 700; font-feature-settings: 'tnum'; margin-right: auto; }
  .symbol-change { padding: 3px 9px; border-radius: 100px; font-size: 11px; font-weight: 600; font-feature-settings: 'tnum'; }
  .symbol-corr { padding: 3px 9px; border-radius: 100px; font-size: 10px; font-weight: 600; font-feature-settings: 'tnum'; }
  .symbol-meta { font-size: 10px; color: var(--muted); font-feature-settings: 'tnum'; width: 100%; }

  /* SETUP DETECTOR */
  .setup-section { padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .setup-grid { display: grid; grid-template-columns: 170px 1fr; gap: 10px; }
  @media (max-width: 700px) { .setup-grid { grid-template-columns: 1fr; } }
  .setup-score-block { background: var(--bg-input); border-radius: 12px; padding: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .score-ring-large { width: 92px; height: 92px; position: relative; }
  .score-ring-large svg { transform: rotate(-90deg); }
  .score-ring-large .score-num-large { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-size: 26px; font-weight: 700; font-feature-settings: 'tnum'; }
  .verdict { padding: 3px 12px; border-radius: 100px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
  .direction-large { font-size: 13px; font-weight: 700; }
  .sub-scores { font-size: 10px; color: var(--muted); font-feature-settings: 'tnum'; }

  .checklist-block { background: var(--bg-input); border-radius: 12px; padding: 10px 14px; }
  .checklist-title { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 8px; font-weight: 600; }
  .checklist-row { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 11px; }
  .check-icon { width: 16px; height: 16px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
  .check-pass { background: var(--green-soft); color: var(--green); }
  .check-fail { background: var(--red-soft); color: var(--red); }
  .check-label { color: var(--text); flex: 1; }
  .check-detail { color: var(--muted); font-size: 10px; font-feature-settings: 'tnum'; }

  .position-block { background: var(--bg-input); border-radius: 12px; padding: 10px 14px; margin-top: 8px; }
  .position-title { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 8px; font-weight: 600; }
  .pos-row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 11px; align-items: center; }
  .pos-label { color: var(--muted); }
  .pos-val { font-weight: 600; font-feature-settings: 'tnum'; }
  .pos-divider { border: none; border-top: 1px solid var(--border); margin: 6px 0; }
  .pos-warning { margin-top: 6px; padding: 6px 9px; background: var(--red-soft); color: var(--red);
    font-size: 10px; border-radius: 7px; text-align: center; font-weight: 600; }
  .pos-disabled { color: var(--muted); font-size: 11px; padding: 14px; text-align: center; }

  /* FUTURES ROW */
  .futures-row {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px;
    padding: 10px 14px; border-bottom: 1px solid var(--border);
  }
  .fut-item { display: flex; flex-direction: column; gap: 2px; }
  .fut-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
  .fut-val { font-size: 12px; font-weight: 600; font-feature-settings: 'tnum'; }

  /* TF CARDS */
  .tf-section { padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .tf-grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
  @media (min-width: 1400px) { main { grid-template-columns: 1fr; } main .tf-grid { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); } }
  .tf-card { background: var(--bg-input); border-radius: 10px; overflow: hidden; }
  .tf-header {
    padding: 8px 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap;
  }
  .tf-label { font-size: 11px; color: var(--accent); font-weight: 700; }
  .tf-trend { font-size: 10px; padding: 2px 9px; border-radius: 100px; font-weight: 600; }
  .tf-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 5px; }

  /* COPY SECTION */
  .copy-section-wrap { padding: 12px 14px; }
  .copy-card { background: var(--bg-input); border-radius: 10px; overflow: hidden; }
  .copy-header {
    padding: 8px 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .copy-title { font-size: 11px; color: var(--accent); font-weight: 700; }
  .copy-btn { padding: 4px 12px; border-radius: 100px; border: none;
    background: var(--accent); color: #fff; cursor: pointer; font-family: inherit; font-size: 10px; font-weight: 600; }
  .copy-btn.copied { background: var(--green); }
  .copy-output { padding: 12px; font-size: 10px; color: var(--text-secondary); line-height: 1.7;
    white-space: pre-wrap; max-height: 280px; overflow-y: auto;
    font-family: 'SF Mono', Menlo, monospace; font-feature-settings: 'tnum'; }

  .loading { color: var(--muted); font-size: 13px; padding: 40px; text-align: center; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-left: 8px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 640px) {
    header { padding: 12px 14px; }
    .overview-section, .watchlist-section, .settings-bar, .context-section, .scanner-section { padding-left: 14px; padding-right: 14px; }
    main { padding: 0 14px 24px; }
    .symbol-header { padding: 14px; }
    .setup-section, .tf-section, .candles-section, .levels-section, .copy-section-wrap { padding: 12px 14px; }

    .top-layout { grid-template-columns: 1fr !important; }
    .clocks-row { gap: 12px; }
    .clock-card { padding: 10px 12px; }
    .clock-face { width: 70px !important; height: 70px !important; }
  }

  /* TOP GRID — 3 BOXES */
  .top-grid {
    display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 10px;
    padding: 12px 14px;
  }
  @media (max-width: 900px) { .top-grid { grid-template-columns: 1fr; } }
  .top-box {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;

    display: flex; flex-direction: column;

    padding: 8px 12px; border-bottom: 1px solid var(--border);

  /* CLOCKS COMPACT */

  .clock-mini { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 2px; background: var(--bg-input); border-radius: 10px; }
  .clock-mini-face { width: 56px; height: 56px; flex-shrink: 0; }

  .clock-mini-time { font-size: 12px; font-weight: 600; color: var(--text-secondary); font-feature-settings: 'tnum'; }
  .clock-mini-status { font-size: 8px; padding: 1px 6px; border-radius: 100px; font-weight: 600; }

  /* NEWS BOX — SLIDESHOW */
  .news-slideshow { position: relative; height: 130px; }
  .news-slide {
    position: absolute; inset: 0;
    display: flex; align-items: center; gap: 12px; padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    text-decoration: none; color: inherit;
    opacity: 0; transform: translateX(20px); pointer-events: none;
    transition: opacity 0.4s ease, transform 0.4s ease;
    overflow: hidden;
  }
  .news-slide.active { opacity: 1; transform: translateX(0); pointer-events: auto; }
  .news-slide::before {
    content: ''; position: absolute; inset: 0;
    background: var(--news-bg, transparent); opacity: 0.12; z-index: 0; pointer-events: none;
  }
  .news-slide > * { position: relative; z-index: 1; }
  .news-impact { width: 5px; height: 60px; border-radius: 3px; flex-shrink: 0; }
  .news-impact.high { background: var(--red); }
  .news-impact.medium { background: var(--amber); }
  .news-impact.low { background: var(--blue); }
  .news-info { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .news-title { font-size: 13px; font-weight: 600; color: var(--text);
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; }
  .news-meta { font-size: 10px; color: var(--muted); font-feature-settings: 'tnum'; }
  .news-country-flag { font-size: 22px; flex-shrink: 0; }
  .news-loading { color: var(--muted); font-size: 11px; padding: 24px; text-align: center; height: 130px;

  .news-arrow:hover { background: var(--bg-hover); border-color: var(--border-strong); }

  .calendar-content { display: flex; flex-direction: column; gap: 10px; }
  .calendar-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 8px; background: var(--bg-input); border-radius: 9px; }

  .calendar-row-value { font-size: 12px; font-weight: 600; font-feature-settings: 'tnum'; }
  .calendar-weekday { text-align: center; padding: 8px; background: var(--accent-soft); border-radius: 9px; }
  .calendar-weekday-name { font-size: 13px; font-weight: 700; color: var(--accent); }

  /* COLLAPSIBLE SECTIONS */
  .collapsible-header {
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; user-select: none;
    padding: 10px 14px;
  }
  .collapse-toggle { font-size: 11px; color: var(--muted); transition: transform 0.25s; padding: 4px; }
  .collapsible.collapsed .collapse-toggle { transform: rotate(-90deg); }
  .collapsible-body { overflow: hidden; transition: max-height 0.3s ease, opacity 0.2s, padding 0.2s; max-height: 4000px; opacity: 1; }
  .collapsible.collapsed .collapsible-body { max-height: 0; opacity: 0; padding-top: 0 !important; padding-bottom: 0 !important; border-bottom-color: transparent !important; }
  .collapsible.collapsed .collapsible-header { border-bottom-color: transparent !important; }
  .collapsible { border-bottom: 1px solid var(--border); }
  .collapsible:last-child { border-bottom: none; }
  .collapsible .collapsible-header { border-bottom: 1px solid transparent; }

  /* SWAPPED TOP LAYOUT — search LEFT (in RTL: appears right), setup RIGHT (in RTL: appears left), equal size */
  .top-layout { display: grid; grid-template-columns: 1fr 1fr; padding: 0 14px 12px; gap: 10px; align-items: start; }
  .top-layout .overview-section { padding: 0; }
  .top-layout .watchlist-section { padding: 0; }

  /* TOAST NOTIFICATION */
  .toast-container {
    position: fixed; bottom: 24px; left: 24px; z-index: 200;
    display: flex; flex-direction: column; gap: 10px;
    pointer-events: none;
  }
  .toast {
    background: var(--bg-card); border: 1px solid var(--green); border-radius: 14px;
    padding: 14px 18px; box-shadow: var(--shadow-lg);
    display: flex; align-items: center; gap: 12px;
    min-width: 260px; max-width: 380px;
    pointer-events: auto;
    animation: toastIn 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.2);
  }
  .toast.toast-out { animation: toastOut 0.5s ease-in forwards; }
  .toast-icon { font-size: 22px; flex-shrink: 0; }
  .toast-body { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .toast-title { font-size: 13px; font-weight: 700; color: var(--green); }
  .toast-msg { font-size: 12px; color: var(--text-secondary); }
  .toast-close { color: var(--muted); cursor: pointer; font-size: 16px; padding: 2px 6px; }
  @keyframes toastIn { from { opacity: 0; transform: translateX(-30px) scale(0.95); } to { opacity: 1; transform: translateX(0) scale(1); } }
  @keyframes toastOut { to { opacity: 0; transform: translateX(-30px) scale(0.95); } }

  /* SCANNER COMPACT */
  .scanner-card.compact { padding: 12px 14px; }
  .scanner-card.compact .scanner-title { font-size: 13px; }
  .scan-result-card.compact { padding: 8px 10px; gap: 4px; }
  .scan-result-fullname { font-size: 10px; color: var(--muted); }
</style>
</head>

<script>
// ── CONSTANTS ──
const BASE = 'https://api.binance.com/api/v3';
const FUT_BASE = 'https://fapi.binance.com/fapi/v1';
const LOGO_BASE = 'https://cdn.jsdelivr.net/gh/spothq/cryptocurrency-icons@master/128/color';
const FINNHUB_KEY = 'd8e5p31r01qm5ffvps40d8e5p31r01qm5ffvps4g';
const FINNHUB_BASE = 'https://finnhub.io/api/v1';

// ── COLLAPSED STATE ──
let collapsedSections = (() => { try { return JSON.parse(localStorage.getItem('aio_collapsed')) || {}; } catch { return {}; } })();
function saveCollapsed() { try { localStorage.setItem('aio_collapsed', JSON.stringify(collapsedSections)); } catch {} }
function toggleSection(key, el) {
  collapsedSections[key] = !collapsedSections[key];
  saveCollapsed();
  el.closest('.collapsible').classList.toggle('collapsed', collapsedSections[key]);
}
function isCollapsed(key) { return !!collapsedSections[key]; }

// ── NEWS / ECONOMIC CALENDAR ──
const COUNTRY_FLAGS = {
  US:'🇺🇸', GB:'🇬🇧', EU:'🇪🇺', DE:'🇩🇪', FR:'🇫🇷', JP:'🇯🇵', CN:'🇨🇳', CA:'🇨🇦',
  AU:'🇦🇺', NZ:'🇳🇿', CH:'🇨🇭', IT:'🇮🇹', ES:'🇪🇸', IN:'🇮🇳', BR:'🇧🇷', RU:'🇷🇺', KR:'🇰🇷'
};
const EVENT_STYLES = [
  { keys: ['fomc','fed','rate','interest'], color: '#ff453a', emoji: '🏦' },
  { keys: ['cpi','inflation'], color: '#ff9f0a', emoji: '📈' },
  { keys: ['gdp','growth'], color: '#0a84ff', emoji: '📊' },
  { keys: ['employ','nfp','jobless','payroll','unemployment'], color: '#30d158', emoji: '💼' },
  { keys: ['pmi','manufacturing'], color: '#bf5af2', emoji: '🏭' },
  { keys: ['retail','sales'], color: '#5e5ce6', emoji: '🛍️' },
];
function eventStyle(eventName) {
  const lower = (eventName || '').toLowerCase();
  for (const s of EVENT_STYLES) {
    if (s.keys.some(k => lower.includes(k))) return s;
  }
  return { color: '#86868b', emoji: '📰' };
}

let newsEvents = [];
let newsIndex = 0;
let newsAutoTimer = null;

function renderNewsSlide() {
  const container = document.getElementById('newsSlideshow');
  const nav = document.getElementById('newsNav');
  const dots = document.getElementById('newsDots');
  if (!container) return;
  if (newsEvents.length === 0) {
    container.innerHTML = '<div class="news-loading">هیچ رویداد مهمی پیدا نشد</div>';
    nav.style.display = 'none';
    return;
  }
  nav.style.display = 'flex';
  container.innerHTML = newsEvents.map((e, i) => {
    const style = eventStyle(e.event || '');
    const flag = COUNTRY_FLAGS[e.country] || '🌍';
    const dt = new Date(e.time);
    const dateStr = new Intl.DateTimeFormat('fa-IR', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }).format(dt);
    const impact = e.impact || 'low';
    const meta = [
      dateStr,
      e.estimate ? `پیش‌بینی: ${e.estimate}${e.unit||''}` : null,
      e.prev ? `قبلی: ${e.prev}${e.unit||''}` : null,
    ].filter(Boolean).join(' • ');
    const sourceUrl = `https://www.google.com/search?q=${encodeURIComponent((e.event||'') + ' ' + (e.country||''))}`;
    return `<a href="${sourceUrl}" target="_blank" rel="noopener" class="news-slide ${i===newsIndex?'active':''}" style="--news-bg:${style.color};">
      <div class="news-impact ${impact}"></div>
      <span class="news-country-flag">${flag}</span>
      <div class="news-info">
        <span class="news-title">${style.emoji} ${e.event||'—'}</span>
        <span class="news-meta">${meta}</span>
      </div>
    </a>`;
  }).join('');
  dots.innerHTML = newsEvents.map((_, i) =>
    `<div class="news-dot ${i===newsIndex?'active':''}" onclick="newsGoTo(${i})"></div>`
  ).join('');
}

function newsGoTo(i) {
  newsIndex = (i + newsEvents.length) % newsEvents.length;
  renderNewsSlide();
  resetNewsAutoplay();
}
function newsNext() { newsGoTo(newsIndex + 1); }
function newsPrev() { newsGoTo(newsIndex - 1); }
function resetNewsAutoplay() {
  if (newsAutoTimer) clearInterval(newsAutoTimer);

async function loadNews() {
  const container = document.getElementById('newsSlideshow');
  if (!container) return;
  container.innerHTML = '<div class="news-loading">در حال بارگذاری...</div>';
  try {
    const today = new Date();
    const future = new Date(today.getTime() + 14*24*60*60*1000);
    const fmt = d => d.toISOString().split('T')[0];
    const url = `${FINNHUB_BASE}/calendar/economic?from=${fmt(today)}&to=${fmt(future)}&token=${FINNHUB_KEY}`;
    const r = await fetch(url);
    const data = await r.json();
    let events = (data.economicCalendar || []).filter(e => e.impact === 'high' || e.impact === 'medium');
    const nowMs = Date.now();
    events = events.filter(e => new Date(e.time).getTime() >= nowMs - 60*60*1000);
    events.sort((a,b) => new Date(a.time) - new Date(b.time));
    newsEvents = events.slice(0, 8);
    newsIndex = 0;
    renderNewsSlide();
    resetNewsAutoplay();
  } catch (err) {
    container.innerHTML = `<div class="news-loading">خطا در بارگذاری</div>`;
  }
}

function getTimeInTimezone(tz) {
  // returns {hour, minute, second, hour24}
  const fmt = new Intl.DateTimeFormat('en-US', { timeZone: tz, hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false });
  const parts = fmt.formatToParts(new Date());
  const h = parseInt(parts.find(p=>p.type==='hour').value);
  const m = parseInt(parts.find(p=>p.type==='minute').value);
  const s = parseInt(parts.find(p=>p.type==='second').value);
  return { h, m, s };
}

function renderClock(id, tz, marketOpenHour, marketCloseHour) {
  const { h, m, s } = getTimeInTimezone(tz);
  const svg = document.getElementById(id);
  if (!svg) return;
  const isDark = document.documentElement.dataset.theme === 'dark';
  const faceColor = isDark ? '#2c2c2e' : '#f5f5f7';
  const borderColor = isDark ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.12)';
  const handColor = isDark ? '#ffffff' : '#1d1d1f';
  const secondColor = '#ff3b30';
  // angles
  const hourAngle = ((h % 12) + m/60) * 30 - 90;
  const minuteAngle = (m + s/60) * 6 - 90;
  const secondAngle = s * 6 - 90;
  // hands as line endpoints
  const hand = (angle, len) => {
    const rad = angle * Math.PI / 180;
    return { x: 50 + Math.cos(rad) * len, y: 50 + Math.sin(rad) * len };
  };
  const H = hand(hourAngle, 22);
  const M = hand(minuteAngle, 30);
  const S = hand(secondAngle, 32);
  // tick marks
  let ticks = '';
  for (let i = 0; i < 12; i++) {
    const ang = i * 30 - 90;
    const rad = ang * Math.PI / 180;
    const r1 = i % 3 === 0 ? 36 : 39;
    const r2 = 43;
    const x1 = 50 + Math.cos(rad) * r1;
    const y1 = 50 + Math.sin(rad) * r1;
    const x2 = 50 + Math.cos(rad) * r2;
    const y2 = 50 + Math.sin(rad) * r2;
    ticks += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${borderColor}" stroke-width="${i%3===0?1.5:0.8}" stroke-linecap="round"/>`;
  }
  svg.innerHTML = `
    <circle cx="50" cy="50" r="46" fill="${faceColor}" stroke="${borderColor}" stroke-width="1.5"/>
    ${ticks}
    <line x1="50" y1="50" x2="${H.x}" y2="${H.y}" stroke="${handColor}" stroke-width="3" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="${M.x}" y2="${M.y}" stroke="${handColor}" stroke-width="2" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="${S.x}" y2="${S.y}" stroke="${secondColor}" stroke-width="1" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="3" fill="${handColor}"/>
    <circle cx="50" cy="50" r="1.5" fill="${secondColor}"/>
  `;
  // Update time and status
  const timeId = id.replace('clock-', 'time-');
  const statusId = id.replace('clock-', 'status-');
  const timeEl = document.getElementById(timeId);
  const statusEl = document.getElementById(statusId);
  if (timeEl) timeEl.textContent = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}`;
  if (statusEl) {
    const isOpen = h >= marketOpenHour && h < marketCloseHour;
    statusEl.textContent = isOpen ? '● بازار باز' : '○ بازار بسته';
    statusEl.className = 'clock-status ' + (isOpen ? 'bg-pos' : 'bg-neg');
  }
}

function updateClocks() {

  renderClock('clock-london', 'Europe/London', 8, 17);
  renderClock('clock-tokyo', 'Asia/Tokyo', 9, 15);
}

function calcEMA(data, period) { const k = 2/(period+1); let ema = data[0]; for (let i=1;i<data.length;i++) ema = data[i]*k + ema*(1-k); return ema; }
function calcRSISeries(closes, period=14) {
  if (closes.length < period+1) return [];
  const rsis = []; let gains = 0, losses = 0;
  for (let i=1; i<=period; i++) { const d = closes[i]-closes[i-1]; if (d>0) gains+=d; else losses-=d; }
  let avgGain = gains/period, avgLoss = losses/period;
  rsis.push(avgLoss === 0 ? 100 : 100 - 100/(1+avgGain/avgLoss));
  for (let i=period+1; i<closes.length; i++) {
    const d = closes[i]-closes[i-1];
    avgGain = (avgGain*(period-1) + Math.max(d,0))/period;
    avgLoss = (avgLoss*(period-1) + Math.max(-d,0))/period;
    rsis.push(avgLoss === 0 ? 100 : 100 - 100/(1+avgGain/avgLoss));
  }
  return rsis;
}
function calcMACD(c) { if (c.length<26) return null; return calcEMA(c.slice(-12),12) - calcEMA(c.slice(-26),26); }
function calcBB(c, p=20) {
  if (c.length<p) return null;
  const s = c.slice(-p), avg = s.reduce((a,b)=>a+b,0)/p;
  const std = Math.sqrt(s.reduce((a,b)=>a+(b-avg)**2,0)/p);
  return { upper: avg+2*std, lower: avg-2*std, mid: avg, bandwidth: (4*std)/avg };
}
function calcATR(candles, period=14) {
  if (candles.length<period+1) return null;
  const trs = [];
  for (let i=1; i<candles.length; i++) {
    const h=parseFloat(candles[i][2]), l=parseFloat(candles[i][3]), pc=parseFloat(candles[i-1][4]);
    trs.push(Math.max(h-l, Math.abs(h-pc), Math.abs(l-pc)));
  }
  let atr = trs.slice(0,period).reduce((a,b)=>a+b,0)/period;
  for (let i=period; i<trs.length; i++) atr = (atr*(period-1)+trs[i])/period;
  return atr;
}
function calcVWAP(candles, periods=20) {
  const s = candles.slice(-periods); let cvp=0, cv=0;
  for (const c of s) { const typ=(parseFloat(c[2])+parseFloat(c[3])+parseFloat(c[4]))/3, v=parseFloat(c[5]); cvp+=typ*v; cv+=v; }
  return cv>0 ? cvp/cv : null;
}
function countTouches(candles, level, tol=0.003) {
  let t = 0;
  for (const c of candles) { const h=parseFloat(c[2]), l=parseFloat(c[3]); if (l<=level*(1+tol) && h>=level*(1-tol)) t++; }
  return t;
}
function calcCorrelation(a, b) {
  const n = Math.min(a.length, b.length); if (n<2) return null;
  const A=a.slice(-n), B=b.slice(-n);
  const mA=A.reduce((x,y)=>x+y,0)/n, mB=B.reduce((x,y)=>x+y,0)/n;
  let num=0, dA=0, dB=0;
  for (let i=0;i<n;i++) { const da=A[i]-mA, db=B[i]-mB; num+=da*db; dA+=da*da; dB+=db*db; }
  return Math.sqrt(dA*dB)===0 ? 0 : num/Math.sqrt(dA*dB);
}
function detectDivergence(closes, highs, lows, rsi) {
  if (closes.length<30 || rsi.length<20) return { type:'NONE', detail:null };
  const n=closes.length, rOff=closes.length-rsi.length;
  const sH=[], sL=[];
  for (let i=n-3; i>Math.max(2,n-30); i--) {
    if (highs[i]>highs[i-1]&&highs[i]>highs[i-2]&&highs[i]>highs[i+1]&&highs[i]>highs[i+2]) {
      sH.push({price:highs[i], rsi:rsi[i-rOff]}); if (sH.length>=2) break;
    }
  }
  for (let i=n-3; i>Math.max(2,n-30); i--) {
    if (lows[i]<lows[i-1]&&lows[i]<lows[i-2]&&lows[i]<lows[i+1]&&lows[i]<lows[i+2]) {
      sL.push({price:lows[i], rsi:rsi[i-rOff]}); if (sL.length>=2) break;
    }
  }
  if (sH.length>=2) {
    const [r,p]=sH;
    if (r.price>p.price && r.rsi<p.rsi && r.rsi!=null && p.rsi!=null)
      return {type:'BEARISH', detail:`Price HH but RSI LH (${r.rsi.toFixed(0)} < ${p.rsi.toFixed(0)})`};
  }
  if (sL.length>=2) {
    const [r,p]=sL;
    if (r.price<p.price && r.rsi>p.rsi && r.rsi!=null && p.rsi!=null)
      return {type:'BULLISH', detail:`Price LL but RSI HL (${r.rsi.toFixed(0)} > ${p.rsi.toFixed(0)})`};
  }
  return {type:'NONE', detail:null};
}
function countConsecutive(candles) {
  let cnt=1;
  const isBull = parseFloat(candles[candles.length-1][4])>=parseFloat(candles[candles.length-1][1]);
  for (let i=candles.length-2; i>=0; i--) {
    const cb = parseFloat(candles[i][4])>=parseFloat(candles[i][1]);
    if (cb===isBull) cnt++; else break;
  }
  return {count:cnt, isBull};
}
function findRoundNumbers(price) {
  const mag = Math.pow(10, Math.floor(Math.log10(price))-1);
  const a = Math.ceil(price/mag)*mag, b = Math.floor(price/mag)*mag;
  const bm = mag*10;
  const ba = Math.ceil(price/bm)*bm, bb = Math.floor(price/bm)*bm;
  return [...new Set([b,a,bb,ba])].filter(n=>Math.abs(n-price)/price<0.05).sort((x,y)=>x-y);
}
function findLevels(candles) {
  const highs=candles.map(c=>parseFloat(c[2])), lows=candles.map(c=>parseFloat(c[3]));
  const current=parseFloat(candles[candles.length-1][4]);
  const prevClose=parseFloat(candles[candles.length-2][4]);
  const direction=current>prevClose?'up':'down';
  const res=[], sup=[];
  for (let i=2; i<candles.length-2; i++) {
    if (highs[i]>highs[i-1]&&highs[i]>highs[i-2]&&highs[i]>highs[i+1]&&highs[i]>highs[i+2]) res.push(highs[i]);
    if (lows[i]<lows[i-1]&&lows[i]<lows[i-2]&&lows[i]<lows[i+1]&&lows[i]<lows[i+2]) sup.push(lows[i]);
  }
  return {
    resistances: res.filter(r=>r>current).sort((a,b)=>a-b).slice(0,2).map(p=>({price:p, touches:countTouches(candles,p)})),
    supports: sup.filter(s=>s<current).sort((a,b)=>b-a).slice(0,2).map(p=>({price:p, touches:countTouches(candles,p)})),
    current, direction
  };
}
function analyzeCandleShape(c) {
  const o=parseFloat(c[1]), h=parseFloat(c[2]), l=parseFloat(c[3]), cl=parseFloat(c[4]);
  const isBull=cl>=o, body=Math.abs(cl-o), range=h-l;
  return {
    isBull, open:o, high:h, low:l, close:cl,
    bodyPct: range>0?((body/range)*100).toFixed(0):0,
    upperPct: range>0?(((h-Math.max(o,cl))/range)*100).toFixed(0):0,
    lowerPct: range>0?(((Math.min(o,cl)-l)/range)*100).toFixed(0):0,
    bodyAbs:body, range
  };
}
function detectCandlePattern(curr, prev) {
  if (!curr) return null;
  const bp=+curr.bodyPct, up=+curr.upperPct, lp=+curr.lowerPct;
  if (bp<=10) return {name:'Doji', signal:'بلاتکلیفی', cls:'bg-neu'};
  if (lp>=60 && bp<=35 && up<=15) return {name:'Pin Bar ▲', signal:'سیگنال صعودی', cls:'bg-pos'};
  if (up>=60 && bp<=35 && lp<=15) return {name:'Pin Bar ▼', signal:'سیگنال نزولی', cls:'bg-neg'};
  if (prev && curr.range>0 && prev.range>0) {
    if (curr.isBull && !prev.isBull && curr.open<=prev.close && curr.close>=prev.open && curr.bodyAbs>prev.bodyAbs)
      return {name:'Engulfing ▲', signal:'صعودی قوی', cls:'bg-pos'};
    if (!curr.isBull && prev.isBull && curr.open>=prev.close && curr.close<=prev.open && curr.bodyAbs>prev.bodyAbs)
      return {name:'Engulfing ▼', signal:'نزولی قوی', cls:'bg-neg'};
  }
  if (lp>=50 && bp>=20 && up<=20 && curr.isBull) return {name:'Hammer ▲', signal:'صعودی', cls:'bg-pos'};
  if (up>=50 && bp>=20 && lp<=20 && !curr.isBull) return {name:'Shooting Star ▼', signal:'نزولی', cls:'bg-neg'};
  return null;
}

function calculateSetup(d) {
  const t15=d['15m'], t1=d['1h'], t4=d['4h'], t1d=d['1d'];
  const price=parseFloat(d.ticker.lastPrice);
  const checks={long:[], short:[]};

  const t4Bull = t4.trend.label==='BULLISH' || (t4.trend.label==='NEUTRAL' && t4.ema20Pct>0);
  const t1dBull = t1d.trend.label==='BULLISH' || (t1d.trend.label==='NEUTRAL' && t1d.ema20Pct>-2);
  checks.long.push({pass: t4Bull && t1dBull, weight:15, label:'ترند 4h و 1d صعودی', detail:`${t4.trend.label}/${t1d.trend.label}`});
  checks.short.push({pass: !t4Bull && !t1dBull, weight:15, label:'ترند 4h و 1d نزولی', detail:`${t4.trend.label}/${t1d.trend.label}`});

  const nearSup = d.levels.supports.find(s => Math.abs((s.price-price)/price)<0.015 && s.touches>=3);
  const nearRes = d.levels.resistances.find(r => Math.abs((r.price-price)/price)<0.015 && r.touches>=3);
  checks.long.push({pass: !!nearSup, weight:15, label:'نزدیک حمایت قوی', detail: nearSup?`$${fmt(nearSup.price)} (${nearSup.touches}×)`:'سطح قوی نزدیک نیست'});
  checks.short.push({pass: !!nearRes, weight:15, label:'نزدیک مقاومت قوی', detail: nearRes?`$${fmt(nearRes.price)} (${nearRes.touches}×)`:'سطح قوی نزدیک نیست'});

  checks.long.push({pass: t15.rsi<70 && t1.rsi<75, weight:10, label:'RSI اشباع نیست', detail:`15m:${t15.rsi} 1h:${t1.rsi}`});
  checks.short.push({pass: t15.rsi>30 && t1.rsi>25, weight:10, label:'RSI اشباع نیست', detail:`15m:${t15.rsi} 1h:${t1.rsi}`});

  const volR = t1.curVol/t1.avgVol;
  checks.long.push({pass: volR>1.2, weight:10, label:'حجم 1h تأیید می‌کنه', detail:`${volR.toFixed(1)}x`});
  checks.short.push({pass: volR>1.2, weight:10, label:'حجم 1h تأیید می‌کنه', detail:`${volR.toFixed(1)}x`});

  checks.long.push({pass: t1.macd>0, weight:10, label:'MACD صعودی (1h)', detail: t1.macd>0?'Bullish':'Bearish'});
  checks.short.push({pass: t1.macd<0, weight:10, label:'MACD نزولی (1h)', detail: t1.macd<0?'Bearish':'Bullish'});

  checks.long.push({pass: t1.vwapPct>0 && t4.vwapPct>-1, weight:10, label:'قیمت بالای VWAP', detail:`1h:${t1.vwapPct.toFixed(2)}% 4h:${t4.vwapPct.toFixed(2)}%`});
  checks.short.push({pass: t1.vwapPct<0 && t4.vwapPct<1, weight:10, label:'قیمت پایین VWAP', detail:`1h:${t1.vwapPct.toFixed(2)}% 4h:${t4.vwapPct.toFixed(2)}%`});

  const noBearDiv = t4.divergence.type!=='BEARISH' && t1.divergence.type!=='BEARISH';
  const noBullDiv = t4.divergence.type!=='BULLISH' && t1.divergence.type!=='BULLISH';
  checks.long.push({pass: noBearDiv, weight:5, label:'بدون واگرایی نزولی', detail: noBearDiv?'پاک':'واگرایی موجود'});
  checks.short.push({pass: noBullDiv, weight:5, label:'بدون واگرایی صعودی', detail: noBullDiv?'پاک':'واگرایی موجود'});

  const fat = t4.consec.count<5;
  checks.long.push({pass: fat || !t4.consec.isBull, weight:10, label:'بدون خستگی روند', detail:`${t4.consec.count}× ${t4.consec.isBull?'▲':'▼'}`});
  checks.short.push({pass: fat || t4.consec.isBull, weight:10, label:'بدون خستگی روند', detail:`${t4.consec.count}× ${t4.consec.isBull?'▲':'▼'}`});

  let fOK=true, fDetail='N/A';
  if (d.funding) {
    const fr = parseFloat(d.funding.lastFundingRate)*100;
    fDetail = `${fr>0?'+':''}${fr.toFixed(4)}%`;
    fOK = Math.abs(fr)<0.05;
  }
  checks.long.push({pass:fOK, weight:5, label:'Funding نرمال', detail:fDetail});
  checks.short.push({pass:fOK, weight:5, label:'Funding نرمال', detail:fDetail});

  const c4Pat = detectCandlePattern(t4.last5Candles[4], t4.last5Candles[3]);
  const patBull = c4Pat && c4Pat.cls==='bg-pos';
  const patBear = c4Pat && c4Pat.cls==='bg-neg';
  checks.long.push({pass: patBull || !c4Pat, weight:5, label:'الگوی کندلی', detail: c4Pat?c4Pat.name:'خنثی'});
  checks.short.push({pass: patBear || !c4Pat, weight:5, label:'الگوی کندلی', detail: c4Pat?c4Pat.name:'خنثی'});

  const atr = t4.atr;
  const nextRes = d.levels.resistances[0]?.price;
  const nextSup = d.levels.supports[0]?.price;
  let rrL=0, rrS=0;
  if (nextRes && nextSup && atr) {
    const slL = price - atr*1.5, slS = price + atr*1.5;
    rrL = slL<price ? (nextRes-price)/(price-slL) : 0;
    rrS = slS>price ? (price-nextSup)/(slS-price) : 0;
  }
  checks.long.push({pass: rrL>=2.5, weight:5, label:'R/R ≥ 2.5', detail:`${rrL.toFixed(2)}:1`});
  checks.short.push({pass: rrS>=2.5, weight:5, label:'R/R ≥ 2.5', detail:`${rrS.toFixed(2)}:1`});

  const score = arr => arr.reduce((s,c)=>s+(c.pass?c.weight:0), 0);
  const lScore=score(checks.long), sScore=score(checks.short);
  let direction, finalScore, finalChecks;
  if (lScore>sScore) { direction='LONG'; finalScore=lScore; finalChecks=checks.long; }
  else if (sScore>lScore) { direction='SHORT'; finalScore=sScore; finalChecks=checks.short; }
  else { direction='NEUTRAL'; finalScore=Math.max(lScore,sScore); finalChecks=checks.long; }

  let verdict, verdictCls;
  if (finalScore>=80) { verdict='GO!'; verdictCls='bg-pos'; }
  else if (finalScore>=60) { verdict='با احتیاط'; verdictCls='bg-neu'; }
  else if (finalScore>=40) { verdict='ضعیف'; verdictCls='bg-neu'; }
  else { verdict='وارد نشو'; verdictCls='bg-neg'; }

  const capital = parseFloat(document.getElementById('capital')?.value) || 50;
  const riskPct = parseFloat(document.getElementById('riskPct')?.value) || 2.5;
  const riskUsd = capital * (riskPct/100);
  let positionSize = null;
  if (direction!=='NEUTRAL' && atr) {
    const slDist = atr*1.5;
    const slDistPct = (slDist/price)*100;
    positionSize = {
      entry:price,
      sl: direction==='LONG' ? price-slDist : price+slDist,
      tp1: direction==='LONG' ? nextRes : nextSup,
      slDistPct, riskUsd,
      sizeUsd: Math.min((riskUsd/slDistPct)*100, capital*10),
      leverage: Math.min(10, Math.ceil((riskUsd/slDistPct)*100/capital))
    };
  }

  return {score:finalScore, direction, verdict, verdictCls, checks:finalChecks, longScore:lScore, shortScore:sScore, positionSize, rrLong:rrL, rrShort:rrS};
}

// ── FETCH ──
async function fetchKlines(s, i, lim=120) { const r = await fetch(`${BASE}/klines?symbol=${s}&interval=${i}&limit=${lim}`); return r.json(); }
async function fetchTicker(s) { const r = await fetch(`${BASE}/ticker/24hr?symbol=${s}`); return r.json(); }
async function fetchFunding(s) { try { const r = await fetch(`${FUT_BASE}/premiumIndex?symbol=${s}`); if (!r.ok) return null; return r.json(); } catch { return null; } }
async function fetchOpenInterest(s) { try { const r = await fetch(`${FUT_BASE}/openInterest?symbol=${s}`); if (!r.ok) return null; return r.json(); } catch { return null; } }

async function loadAllUSDTSymbols() {
  try {
    const r = await fetch(`${BASE}/ticker/24hr`);
    const all = await r.json();
    allUSDTSymbols = all
      .filter(t => t.symbol.endsWith('USDT') && !/UP|DOWN|BEAR|BULL/.test(t.symbol.replace('USDT','')))
      .sort((a,b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume))
      .map(t => t.symbol);
  } catch {}
}

const analyzeCandles = (candles) => {
  const closes=candles.map(c=>parseFloat(c[4]));
  const highs=candles.map(c=>parseFloat(c[2]));
  const lows=candles.map(c=>parseFloat(c[3]));
  const volumes=candles.map(c=>parseFloat(c[5]));
  const price=closes[closes.length-1];
  const isOpen=candles[candles.length-1][6]>Date.now();
  const ema20=calcEMA(closes.slice(-20),20), ema50=calcEMA(closes.slice(-50),50), ema200=calcEMA(closes,200);
  const rsiSeries=calcRSISeries(closes);
  const rsi=rsiSeries.length?Math.round(rsiSeries[rsiSeries.length-1]):null;
  const macd=calcMACD(closes), bb=calcBB(closes), atr=calcATR(candles);
  const avgVol=volumes.slice(-20).reduce((a,b)=>a+b,0)/20;
  const last5=candles.slice(-5).map(analyzeCandleShape);
  const vwap=calcVWAP(candles,20);
  return {
    price, ema20, ema50, ema200,
    ema20Pct:pctNum(price,ema20), ema50Pct:pctNum(price,ema50), ema200Pct:pctNum(price,ema200),
    rsi, macd, bb, atr, atrPct:atr?(atr/price*100):null, avgVol, curVol:volumes[volumes.length-1],
    trend:trendLabel(price,ema20,ema50,ema200), last5Candles:last5, isOpen,
    divergence: detectDivergence(closes, highs, lows, rsiSeries),
    consec: countConsecutive(candles),
    vwap, vwapPct: vwap?pctNum(price,vwap):null, closes
  };
};

async function analyzeSymbol(symbol) {
  const [ticker, k15m, k1h, k4h, k1d, funding, oi] = await Promise.all([
    fetchTicker(symbol), fetchKlines(symbol,'15m'), fetchKlines(symbol,'1h'), fetchKlines(symbol,'4h'), fetchKlines(symbol,'1d',60),
    fetchFunding(symbol), fetchOpenInterest(symbol),
  ]);
  return {
    symbol, ticker, funding, oi,
    '15m':analyzeCandles(k15m), '1h':analyzeCandles(k1h), '4h':analyzeCandles(k4h), '1d':analyzeCandles(k1d),
    levels: findLevels(k4h),
    roundNumbers: findRoundNumbers(parseFloat(ticker.lastPrice)),
  };
}

async function scanSymbolLight(symbol) {
  try {
    const [ticker, k15m, k1h, k4h, k1d] = await Promise.all([
      fetchTicker(symbol), fetchKlines(symbol,'15m'), fetchKlines(symbol,'1h'), fetchKlines(symbol,'4h'), fetchKlines(symbol,'1d',60),
    ]);
    const d = {
      symbol, ticker, funding:null, oi:null,
      '15m':analyzeCandles(k15m), '1h':analyzeCandles(k1h), '4h':analyzeCandles(k4h), '1d':analyzeCandles(k1d),
      levels: findLevels(k4h),
      roundNumbers: findRoundNumbers(parseFloat(ticker.lastPrice)),
    };
    return { d, setup: calculateSetup(d) };
  } catch { return null; }
}

// ── SEARCH ──
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');
let searchHighlight = -1;
function updateSearch() {
  const q = searchInput.value.trim().toUpperCase();
  if (!q) { searchResults.classList.remove('active'); return; }
  const matches = allUSDTSymbols
    .filter(s => s.includes(q))
    .slice(0, 8);
  if (matches.length === 0) {
    searchResults.innerHTML = '<div style="padding:12px;color:var(--muted);font-size:12px;text-align:center;">یافت نشد</div>';
    searchResults.classList.add('active');
    return;
  }
  searchHighlight = -1;
  searchResults.innerHTML = matches.map((s, i) => {
    const sym = s.replace('USDT','');
    const inList = symbols.includes(s);
    return `<div class="search-result-item ${i===0?'highlighted':''}" data-symbol="${s}" onclick="addSymbolFromSearch('${s}')">
      <div class="search-result-logo">${logoHTML(s, 24)}</div>
      <div class="search-result-info">
        <span class="search-result-symbol">${sym}</span>
        <span class="search-result-pair">${sym} / USDT</span>
      </div>
      <span class="search-result-add">${inList ? '✓' : '+'}</span>
    </div>`;
  }).join('');
  searchHighlight = 0;
  searchResults.classList.add('active');
}
searchInput.addEventListener('input', updateSearch);
searchInput.addEventListener('focus', updateSearch);
searchInput.addEventListener('blur', () => setTimeout(()=>searchResults.classList.remove('active'), 200));
searchInput.addEventListener('keydown', e => {
  const items = searchResults.querySelectorAll('.search-result-item');
  if (e.key === 'ArrowDown') { e.preventDefault(); searchHighlight = Math.min(searchHighlight+1, items.length-1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); searchHighlight = Math.max(searchHighlight-1, 0); }
  else if (e.key === 'Enter') { e.preventDefault(); if (items[searchHighlight]) items[searchHighlight].click(); return; }
  else if (e.key === 'Escape') { searchResults.classList.remove('active'); return; }
  else return;
  items.forEach((it,i) => it.classList.toggle('highlighted', i===searchHighlight));
});

function addSymbolFromSearch(s) {
  if (!symbols.includes(s)) {
    symbols.push(s);
    saveSettings();
    renderWatchlist();
    refreshAll();
  }
  searchInput.value = '';
  searchResults.classList.remove('active');
}
function removeSymbol(s) {
  symbols = symbols.filter(x=>x!==s);
  saveSettings();
  renderWatchlist();
  const el = document.getElementById(`sym-${s}`);
  if (el) el.remove();
  // Re-render overview
  const remaining = Object.entries(currentSetups).filter(([sym]) => symbols.includes(sym)).map(([,v]) => v);
  renderOverviewRow(remaining);
}

    const volR = (t.curVol/t.avgVol).toFixed(1);

    const cs = t.isOpen?'<span class="neu">● باز</span>':'<span style="color:var(--muted)">● بسته</span>';
    let dB = '';
    if (t.divergence.type==='BEARISH') dB = '<span class="diverg-badge bg-neg">⚠ واگرایی نزولی</span>';
    else if (t.divergence.type==='BULLISH') dB = '<span class="diverg-badge bg-pos">⚠ واگرایی صعودی</span>';
    const pat = detectCandlePattern(t.last5Candles[4], t.last5Candles[3]);
    const patBadge = pat ? `<span class="pattern-badge ${pat.cls}">${pat.name}</span>` : '';

    return `<div class="tf-card">
      <div class="tf-header">
        <span class="tf-label">${tf.toUpperCase()}</span>
        <span class="tf-trend ${t.trend.cls}">${t.trend.label}</span>
        <span style="font-size:11px;">${cs}</span>
      </div>
      <div class="tf-body">
        ${dB ? `<div class="ind-row"><span class="ind-name">واگرایی</span>${dB}</div>` : ''}
        ${patBadge ? `<div class="ind-row"><span class="ind-name">الگو</span>${patBadge}</div>` : ''}
        ${dB || patBadge ? '<hr class="section-divider-soft">' : ''}
        <div class="ind-row"><span class="ind-name">RSI(14)</span><span class="ind-val ${rsiColor(t.rsi)}">${t.rsi??'—'} ${t.rsi>70?'⚠':''}${t.rsi<30?'⚠':''}</span></div>
        <div class="ind-row"><span class="ind-name">ATR(14)</span><span class="ind-val pur">${fmt(t.atr)} (${t.atrPct?.toFixed(2)}%)</span></div>
        <hr class="section-divider-soft">
        <div class="ind-row"><span class="ind-name">EMA 20</span><span class="ind-val ${t.ema20Pct>=0?'pos':'neg'}">${fmt(t.ema20)} (${t.ema20Pct>=0?'+':''}${t.ema20Pct.toFixed(2)}%)</span></div>
        <div class="ind-row"><span class="ind-name">EMA 50</span><span class="ind-val ${t.ema50Pct>=0?'pos':'neg'}">${fmt(t.ema50)} (${t.ema50Pct>=0?'+':''}${t.ema50Pct.toFixed(2)}%)</span></div>
        <div class="ind-row"><span class="ind-name">EMA 200</span><span class="ind-val ${t.ema200Pct>=0?'pos':'neg'}">${fmt(t.ema200)} (${t.ema200Pct>=0?'+':''}${t.ema200Pct.toFixed(2)}%)</span></div>
        <div class="ind-row"><span class="ind-name">VWAP(20)</span><span class="ind-val ${t.vwapPct>=0?'pos':'neg'}">${fmt(t.vwap)} (${t.vwapPct>=0?'+':''}${t.vwapPct?.toFixed(2)}%)</span></div>
        <hr class="section-divider-soft">
        <div class="ind-row"><span class="ind-name">MACD</span><span class="ind-val">${macdDir}</span></div>
        <div class="ind-row"><span class="ind-name">Bollinger</span><span class="ind-val">${bbPos}</span></div>
        <hr class="section-divider-soft">
        <div class="ind-row"><span class="ind-name">حجم</span><span class="ind-val ${volCls}">${volR}x</span></div>
        <div class="ind-row"><span class="ind-name">کندل متوالی</span><span class="ind-val ${t.consec.count>=5?'neu':''}">${t.consec.count}x ${t.consec.isBull?'▲':'▼'} ${t.consec.count>=5?'⚠':''}</span></div>
      </div>
    </div>`;
  }).join('');

  // Candles 5
  const t4 = d['4h'];
  let candlesHtml = '';
  if (t4?.last5Candles) {
    const rows = t4.last5Candles.map((c,i) => {
      const lbl = i===4 ? (t4.isOpen?'فعلی (باز)':'فعلی') : `کندل -${4-i}`;
      const cls = c.isBull?'pos':'neg';
      const chg = ((c.close-c.open)/c.open*100).toFixed(2);
      return `<tr><td style="color:var(--muted)">${lbl}</td><td class="${cls}">${c.isBull?'▲':'▼'}</td><td>${fmt(c.open)}</td><td>${fmt(c.high)}</td><td>${fmt(c.low)}</td><td class="${cls}">${fmt(c.close)}</td><td class="${cls}">${chg>0?'+':''}${chg}%</td><td style="color:var(--muted)">${c.upperPct}/${c.bodyPct}/${c.lowerPct}</td></tr>`;
    }).join('');
    candlesHtml = `<div class="candles-card">
      <div class="candles-title">۵ کندل آخر — 4H (سایه/بدنه/سایه %)</div>
      <div style="overflow-x:auto;"><table class="candles-table">
        <thead><tr><th>کندل</th><th></th><th>Open</th><th>High</th><th>Low</th><th>Close</th><th>تغییر</th><th>U/B/L</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
  }

  // Levels
  const levels = d.levels;
  let levelsHtml = '';
  levels.resistances.forEach((r,i) => {
    const dist = pct(r.price, price);
    const appr = levels.direction==='up'?'<span class="neg">→ نزدیک</span>':'<span style="color:var(--muted)">← دور</span>';
    const str = r.touches>=3?`<span class="bg-neu" style="font-size:10px;padding:2px 7px;border-radius:100px;margin-right:4px">${r.touches}× ⚠</span>`:`<span style="color:var(--muted);font-size:10px">${r.touches}×</span>`;
    levelsHtml += `<div class="level-row"><span class="level-type neg">مقاومت ${i+1} ${str}</span><div class="level-bar"><div class="level-fill" style="width:${Math.min(100,Math.abs(parseFloat(dist))*15)}%;background:var(--red)"></div></div><span class="level-price neg">$${fmt(r.price)}</span><span class="level-dist">+${dist}%</span><span class="level-dir">${appr}</span></div>`;
  });
  d.roundNumbers.forEach(rn => {
    if (Math.abs(rn-price)/price<0.001) return;
    const dist = pct(rn, price);
    levelsHtml += `<div class="level-row"><span class="level-type pur">عدد رند</span><div class="level-bar"><div class="level-fill" style="width:${Math.min(100,Math.abs(parseFloat(dist))*15)}%;background:var(--purple)"></div></div><span class="level-price pur">$${fmt(rn)}</span><span class="level-dist">${rn>price?'+':''}${dist}%</span><span class="level-dir" style="color:var(--muted)">روانی</span></div>`;
  });
  levelsHtml += `<div class="level-row"><span class="level-type" style="color:var(--accent)">قیمت</span><div class="level-bar"><div class="level-fill" style="width:50%;background:var(--accent)"></div></div><span class="level-price" style="color:var(--accent)">$${fmt(price)}</span><span class="level-dist">—</span><span class="level-dir" style="color:var(--muted)">${levels.direction==='up'?'↑':'↓'}</span></div>`;
  levels.supports.forEach((s,i) => {
    const dist = pct(s.price, price);
    const appr = levels.direction==='down'?'<span class="pos">→ نزدیک</span>':'<span style="color:var(--muted)">← دور</span>';
    const str = s.touches>=3?`<span class="bg-neu" style="font-size:10px;padding:2px 7px;border-radius:100px;margin-right:4px">${s.touches}× ⚠</span>`:`<span style="color:var(--muted);font-size:10px">${s.touches}×</span>`;
    levelsHtml += `<div class="level-row"><span class="level-type pos">حمایت ${i+1} ${str}</span><div class="level-bar"><div class="level-fill" style="width:${Math.min(100,Math.abs(parseFloat(dist))*15)}%;background:var(--green)"></div></div><span class="level-price pos">$${fmt(s.price)}</span><span class="level-dist">${dist}%</span><span class="level-dir">${appr}</span></div>`;
  });

  const report = generateReport(d, setup);

  return `<div class="symbol-section" id="sym-${d.symbol}">
    <div class="symbol-header">
      <div class="symbol-header-logo">${logoHTML(d.symbol, 36)}</div>
      <span class="symbol-name">${sym}<span class="pair">/USDT</span></span>
      <span class="symbol-price">$${fmt(price)}</span>
      <span class="symbol-change ${changeCls}">${change>0?'+':''}${change.toFixed(2)}%</span>
      ${d.symbol!=='BTCUSDT' && d.btcCorrelation!=null?`<span class="symbol-corr ${Math.abs(d.btcCorrelation)>0.7?'bg-pur':'bg-neu'}">⛓ ${d.btcCorrelation.toFixed(2)}</span>`:''}
      <span class="symbol-meta">H: $${fmt(parseFloat(d.ticker.highPrice))} | L: $${fmt(parseFloat(d.ticker.lowPrice))}</span>
    </div>
    <div class="symbol-body">
      <div class="full-width">${setupHtml}</div>
      ${futuresHtml ? `<div>${futuresHtml}</div>` : ''}
      <div class="collapsible ${isCollapsed(d.symbol+'-tf')?'collapsed':''}">
        <div class="collapsible-header" onclick="toggleSection('${d.symbol}-tf', this)">
          <span style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:600;">📈 تایم‌فریم‌ها</span>
          <span class="collapse-toggle">▼</span>
        </div>
        <div class="collapsible-body tf-section">
          <div class="tf-grid">${tfCards}</div>
        </div>
      </div>
      <div class="collapsible ${isCollapsed(d.symbol+'-candles')?'collapsed':''}">
        <div class="collapsible-header" onclick="toggleSection('${d.symbol}-candles', this)">
          <span style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:600;">🕯 ۵ کندل آخر (4H)</span>
          <span class="collapse-toggle">▼</span>
        </div>
        <div class="collapsible-body candles-section">
          ${candlesHtml}
        </div>
      </div>
      <div class="collapsible ${isCollapsed(d.symbol+'-levels')?'collapsed':''}">
        <div class="collapsible-header" onclick="toggleSection('${d.symbol}-levels', this)">
          <span style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:600;">📍 سطوح کلیدی</span>
          <span class="collapse-toggle">▼</span>
        </div>
        <div class="collapsible-body levels-section">
          <div class="levels-card"><div class="levels-title">سطوح کلیدی (4h) + اعداد رند</div>${levelsHtml}</div>
        </div>
      </div>
      <div class="collapsible full-width ${isCollapsed(d.symbol+'-copy')?'collapsed':''}">
        <div class="collapsible-header" onclick="toggleSection('${d.symbol}-copy', this)">
          <span style="font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:0.5px;font-weight:700;">◈ گزارش برای Claude</span>
          <span class="collapse-toggle">▼</span>
        </div>
        <div class="collapsible-body copy-section-wrap">
          <div class="copy-card">
            <div class="copy-header">
              <span class="copy-title">برای کپی</span>
              <button class="copy-btn" onclick="copyReport('${d.symbol}')">کپی</button>

            <div id="copyOutput-${d.symbol}" class="copy-output">${report}</div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function generateReport(d, setup) {
  const price = parseFloat(d.ticker.lastPrice);
  const change = parseFloat(d.ticker.priceChangePercent);
  const now = new Date().toUTCString();
  const tfs = ['15m','1h','4h','1d'];

  let setupLine = `\n── SETUP DETECTOR ──\nScore       : ${setup.score}/100 (Long:${setup.longScore}, Short:${setup.shortScore})\nDirection   : ${setup.direction}\nVerdict     : ${setup.verdict}\nFailed Checks:\n${setup.checks.filter(c=>!c.pass).map(c=>`  ✗ ${c.label} (${c.detail})`).join('\n') || '  (همه پاس)'}`;
  if (setup.positionSize) {
    const p = setup.positionSize;
    setupLine += `\n\n── POSITION SIZE (پیشنهادی) ──\nEntry       : $${fmt(p.entry)}\nSL          : $${fmt(p.sl)} (${p.slDistPct.toFixed(2)}%)\nTP1         : $${fmt(p.tp1 || 0)}\nRisk        : $${p.riskUsd.toFixed(2)}\nSize        : $${p.sizeUsd.toFixed(2)} (${p.leverage}x leverage)`;
  }

  let futuresLine = '';
  if (d.funding && d.oi) {
    const fr = parseFloat(d.funding.lastFundingRate)*100;
    const oiV = parseFloat(d.oi.openInterest);
    futuresLine = `\n── FUTURES ──\nFunding     : ${fr>0?'+':''}${fr.toFixed(4)}%\nOpen Int.   : ${oiV.toLocaleString('en-US',{maximumFractionDigits:0})} ($${(oiV*price/1e9).toFixed(2)}B)`;
  }

  let tfLines = tfs.map(tf => {
    const t = d[tf]; if (!t) return '';
    const macdDir = t.macd>0?'Bullish':'Bearish';
    const bbPos = t.bb?(price>t.bb.upper?'Above Upper':price<t.bb.lower?'Below Lower':'Inside'):'N/A';
    const volR = (t.curVol/t.avgVol).toFixed(1);
    const cs = t.isOpen?'OPEN':'CLOSED';
    const lc = t.last5Candles[4];
    const lcChg = ((lc.close-lc.open)/lc.open*100).toFixed(2);
    const pat = detectCandlePattern(t.last5Candles[4], t.last5Candles[3]);
    let divLine = ''; if (t.divergence.type!=='NONE') divLine = `\nDivergence  : ${t.divergence.type} — ${t.divergence.detail}`;
    let patLine = pat ? `\nPattern     : ${pat.name} (${pat.signal})` : '';
    return `\n── ${tf.toUpperCase()} ──\nCandle      : ${cs} | ${lc.isBull?'B':'b'} Chg:${lcChg>0?'+':''}${lcChg}% | U/B/L: ${lc.upperPct}/${lc.bodyPct}/${lc.lowerPct}${patLine}\nTrend       : ${t.trend.label}\nRSI(14)     : ${t.rsi??'N/A'}${divLine}\nATR(14)     : ${fmt(t.atr)} (${t.atrPct?.toFixed(2)}%)\nEMA 20/50/200: ${fmt(t.ema20)} (${t.ema20Pct>=0?'+':''}${t.ema20Pct.toFixed(2)}%) / ${fmt(t.ema50)} (${t.ema50Pct>=0?'+':''}${t.ema50Pct.toFixed(2)}%) / ${fmt(t.ema200)} (${t.ema200Pct>=0?'+':''}${t.ema200Pct.toFixed(2)}%)\nVWAP(20)    : ${fmt(t.vwap)} (${t.vwapPct>=0?'+':''}${t.vwapPct?.toFixed(2)}%)\nMACD        : ${macdDir} (${fmt(t.macd,4)})\nBollinger   : ${bbPos}\nVolume      : ${volR}x avg\nConsecutive : ${t.consec.count}x ${t.consec.isBull?'Bull':'Bear'}`;
  }).join('');

  const t4h = d['4h'];
  let candleLines = '\n── 4H LAST 5 CANDLES ──\n';
  t4h.last5Candles.forEach((c,i) => {
    const lbl = i===4?(t4h.isOpen?'Current(OPEN)':'Current'):`Candle-${4-i}`;
    const chg = ((c.close-c.open)/c.open*100).toFixed(2);
    candleLines += `${lbl.padEnd(14)}: ${c.isBull?'B':'b'} O:${fmt(c.open)} H:${fmt(c.high)} L:${fmt(c.low)} C:${fmt(c.close)} | Chg:${chg>0?'+':''}${chg}% | U/B/L:${c.upperPct}/${c.bodyPct}/${c.lowerPct}\n`;
  });

  const levels = d.levels;
  const res = levels.resistances.map((r,i)=>`  R${i+1}: $${fmt(r.price)} (+${pct(r.price,price)}%) — ${r.touches}x tested${r.touches>=3?' STRONG':''}`).join('\n');
  const sup = levels.supports.map((s,i)=>`  S${i+1}: $${fmt(s.price)} (${pct(s.price,price)}%) — ${s.touches}x tested${s.touches>=3?' STRONG':''}`).join('\n');
  const round = d.roundNumbers.map(rn=>`  $${fmt(rn)} (${rn>price?'+':''}${pct(rn,price)}%)`).join('\n');

  let corrLine = '';
  if (d.btcCorrelation!=null) corrLine = `\n── BTC CORRELATION (4h) ──\nCorrelation: ${d.btcCorrelation.toFixed(2)}\n`;

  return `ANALYSIS REQUEST\nSymbol      : ${d.symbol}\nTime        : ${now}\nPrice       : $${fmt(price)}\n24h Change  : ${change>0?'+':''}${change.toFixed(2)}%\n${setupLine}\n${futuresLine}\n${tfLines}\n${candleLines}\n── KEY LEVELS (4h) ──\nResistances:\n${res || '  N/A'}\nSupports:\n${sup || '  N/A'}\n\n── ROUND NUMBERS ──\n${round || '  N/A'}\n${corrLine}`;
}

function copyReport(symbol) {
  const el = document.getElementById(`copyOutput-${symbol}`);
  navigator.clipboard.writeText(el.textContent).then(() => {
    const btn = document.querySelector(`#sym-${symbol} .copy-btn`);
    if (btn) { btn.textContent = 'کپی شد'; btn.classList.add('copied'); setTimeout(()=>{btn.textContent='کپی کردن'; btn.classList.remove('copied');}, 2000); }
  });
}

async function renderMarketContext(symbolData) {
  try {
    const btc = symbolData.find(d=>d.symbol==='BTCUSDT');
    const eth = symbolData.find(d=>d.symbol==='ETHUSDT');
    const btcChg = btc?parseFloat(btc.ticker.priceChangePercent):0;
    const ethChg = eth?parseFloat(eth.ticker.priceChangePercent):0;
    const sentiment = btcChg>2?'BULLISH':btcChg<-2?'BEARISH':'NEUTRAL';
    const sentCls = btcChg>2?'pos':btcChg<-2?'neg':'neu';
    const regime = btc ? detectRegime(btc['4h']) : {label:'N/A', cls:'neu', sub:'-'};
    const session = getMarketSession();
    const ethVsBtc = ethChg - btcChg;
    document.getElementById('marketContext').innerHTML = `<div class="market-context"><div class="ctx-card"><div class="ctx-label">بازار کلی (BTC)</div><div class="ctx-value ${sentCls}">${sentiment}</div><div class="ctx-sub">${btcChg>0?'+':''}${btcChg.toFixed(2)}%</div></div><div class="ctx-card"><div class="ctx-label">رژیم بازار</div><div class="ctx-value ${regime.cls}">${regime.label}</div><div class="ctx-sub">${regime.sub}</div></div><div class="ctx-card"><div class="ctx-label">سشن فعلی</div><div class="ctx-value ${session.cls}">${session.label}</div><div class="ctx-sub">${session.quality}</div></div><div class="ctx-card"><div class="ctx-label">قدرت نسبی ETH/BTC</div><div class="ctx-value ${ethVsBtc>0.5?'pos':ethVsBtc<-0.5?'neg':'neu'}">${ethVsBtc>0.5?'ETH قوی‌تر':ethVsBtc<-0.5?'BTC قوی‌تر':'هم‌راستا'}</div><div class="ctx-sub">${ethVsBtc>0?'+':''}${ethVsBtc.toFixed(2)}%</div></div></div>`;
  } catch {}
}

function playAlertSound() {
  if (!soundEnabled) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.2, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    o.start(); o.stop(ctx.currentTime + 0.5);
  } catch {}
}
function triggerAlert(syms) {
  const symList = syms.join(', ');
  showToast('Setup قوی پیدا شد', symList);
  document.title = `🚨 Setup! — Trade Intel`;
  playAlertSound();
  setTimeout(() => { document.title='Trade Intel'; }, 30000);
}

async function refreshAll() {
  const main = document.getElementById('mainContent');
  if (main.innerHTML === '') main.innerHTML = '<div class="loading">در حال بارگذاری... <span class="spinner"></span></div>';
  try {
    const symbolData = await Promise.all(symbols.map(s=>analyzeSymbol(s)));
    const btcData = symbolData.find(d=>d.symbol==='BTCUSDT');
    if (btcData?.['4h']?.closes) {
      symbolData.forEach(d => {
        if (d.symbol==='BTCUSDT') d.btcCorrelation = 1.0;
        else if (d['4h']?.closes) {
          const bC = btcData['4h'].closes.slice(-50), sC = d['4h'].closes.slice(-50);
          const bR=[], sR=[]; const len = Math.min(bC.length, sC.length);
          for (let i=1; i<len; i++) {
            bR.push((bC[i]-bC[i-1])/bC[i-1]);
            sR.push((sC[i]-sC[i-1])/sC[i-1]);
          }
          d.btcCorrelation = calcCorrelation(bR, sR);
        }
      });
    }
    const setups = symbolData.map(d => ({d, setup: calculateSetup(d)}));
    currentSetups = {};
    setups.forEach(({d, setup}) => { currentSetups[d.symbol] = {d, setup}; });
    renderOverviewRow(setups);
    await renderMarketContext(symbolData);
    main.innerHTML = setups.map(({d, setup}) => renderSymbol(d, setup)).join('');
    document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('fa-IR');
    const strong = setups.filter(({d, setup}) => {
      const was = (lastAlertScores[d.symbol] || 0) >= 80;
      const is = setup.score >= 80;
      lastAlertScores[d.symbol] = setup.score;
      return is && !was;
    });
    if (strong.length > 0) triggerAlert(strong.map(({d}) => d.symbol.replace('USDT','')));
  } catch (e) {
    main.innerHTML = `<div class="loading">خطا: ${e.message}</div>`;
  }
}

async function fetchTopSymbols(limit=50) { return allUSDTSymbols.slice(0, limit); }
async function runScan() {
  if (isScanning) return;
  isScanning = true;
  const btn = document.getElementById('scanBtn');
  const status = document.getElementById('scanStatus');
  const progress = document.getElementById('scanProgress');
  const progressBar = document.getElementById('scanProgressBar');
  btn.disabled = true; btn.textContent = 'در حال اسکن...';
  progress.style.display = 'block'; progressBar.style.width = '0%';
  try {
    if (allUSDTSymbols.length === 0) await loadAllUSDTSymbols();
    const topSymbols = await fetchTopSymbols(50);
    const allResults = [];
    const batchSize = 5; let done = 0;
    for (let i = 0; i < topSymbols.length; i += batchSize) {
      const batch = topSymbols.slice(i, i + batchSize);
      const r = await Promise.all(batch.map(s => scanSymbolLight(s)));
      r.forEach(x => { if (x) allResults.push(x); });
      done += batch.length;
      progressBar.style.width = `${(done/topSymbols.length)*100}%`;
      status.textContent = `اسکن: ${done}/${topSymbols.length}`;
    }
    const strong = allResults.filter(r => r.setup.score >= 80).sort((a,b) => b.setup.score - a.setup.score);
    lastScanResults = strong;
    renderScanResults(strong);
    const newFinds = strong.filter(r => !(lastAlertScores['SCAN_' + r.d.symbol] >= 80));
    strong.forEach(r => { lastAlertScores['SCAN_' + r.d.symbol] = r.setup.score; });
    const now = new Date().toLocaleTimeString('fa-IR');
    if (strong.length > 0) {
      status.textContent = `${strong.length} Setup قوی — ${now}`;
      status.style.color = 'var(--green)';
      if (newFinds.length > 0) triggerAlert(newFinds.map(r => r.d.symbol.replace('USDT','')));
    } else {
      status.textContent = `هیچ Setup قوی نیست — ${now}`;
      status.style.color = 'var(--muted)';
    }
    progress.style.display = 'none';
  } catch (e) {
    status.textContent = `خطا: ${e.message}`;
    status.style.color = 'var(--red)';
  } finally {
    btn.disabled = false; btn.textContent = 'اسکن الان';
    isScanning = false;
  }
}
function renderScanResults(results) {
  const container = document.getElementById('scanResults');
  if (results.length === 0) {
    container.innerHTML = '<div class="scan-empty">هیچ Setup با امتیاز ۸۰+ پیدا نشد.</div>';
    return;
  }
  container.innerHTML = results.map(({d, setup}) => {
    const price = parseFloat(d.ticker.lastPrice);
    const change = parseFloat(d.ticker.priceChangePercent);
    const dirColor = setup.direction === 'LONG' ? 'var(--green)' : 'var(--red)';
    const dirArrow = setup.direction === 'LONG' ? '▲' : '▼';
    const scoreColor = setup.score >= 90 ? 'var(--green)' : 'var(--amber)';
    const alreadyAdded = symbols.includes(d.symbol);
    const sym = d.symbol.replace('USDT','');
    return `<div class="scan-result-card compact">
      <div class="scan-result-top">
        <div style="display:flex;align-items:center;gap:8px;min-width:0;flex:1;">
          <div class="overview-logo" style="width:24px;height:24px;">${logoHTML(d.symbol, 24)}</div>
          <div style="display:flex;flex-direction:column;min-width:0;">
            <span class="scan-result-name">${sym}</span>
            <span class="scan-result-fullname">${coinName(d.symbol)}</span>
          </div>
        </div>
        <span class="scan-result-score" style="color:${scoreColor};">${setup.score}</span>
      </div>
      <div class="scan-result-row">
        <span style="color:var(--muted);">$${fmt(price)}</span>
        <span style="color:${change>=0?'var(--green)':'var(--red)'};">${change>=0?'+':''}${change.toFixed(2)}%</span>
      </div>
      <div class="scan-result-row">
        <span style="color:${dirColor};font-weight:700;">${dirArrow} ${setup.direction}</span>
        ${alreadyAdded?'<span style="font-size:10px;color:var(--muted);">✓ تو لیست</span>'
          :`<button class="btn" style="padding:2px 10px;font-size:10px;" onclick="addFromScanner('${d.symbol}')">+ افزودن</button>`}
      </div>
    </div>`;
  }).join('');
}
function addFromScanner(s) {
  if (!symbols.includes(s)) {
    symbols.push(s);
    saveSettings();
    renderWatchlist();
    refreshAll();
    renderScanResults(lastScanResults);
  }
}

function toggleTF(btn) {
  const tf = btn.dataset.tf;
  if (btn.classList.contains('active')) {
    if (activeTFs.length>1) { activeTFs = activeTFs.filter(t=>t!==tf); btn.classList.remove('active'); }
  } else { activeTFs.push(tf); btn.classList.add('active'); }
  saveSettings();
  refreshAll();
}

document.getElementById('capital').addEventListener('change', () => { saveSettings(); refreshAll(); });
document.getElementById('riskPct').addEventListener('change', () => { saveSettings(); refreshAll(); });

if (_saved) {
  if (_saved.capital) document.getElementById('capital').value = _saved.capital;
  if (_saved.riskPct) document.getElementById('riskPct').value = _saved.riskPct;
}
document.querySelectorAll('.tf-btn').forEach(btn => {
  if (activeTFs.includes(btn.dataset.tf)) btn.classList.add('active');
  else btn.classList.remove('active');
});

(async () => {
  updateDates();
  updateClocks();
  setInterval(updateClocks, 1000);
  setInterval(updateDates, 60000);
  loadNews();
  setInterval(loadNews, 30 * 60 * 1000);
  await loadAllUSDTSymbols();
  renderWatchlist();
  await refreshAll();
  setTimeout(runScan, 3000);
})();
setInterval(refreshAll, 60000);
setInterval(runScan, 10 * 60 * 1000);
</script>
</body>
